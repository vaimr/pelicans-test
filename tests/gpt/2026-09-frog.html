<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f7f7ed" />
  <title>Попутного ветра — маленькая прогулка</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f7ed;
      --ink: #294f3c;
      --muted: #788571;
      --frog-outline: #35583a;
      /* A penny-farthing's pedals turn together with its large wheel. */
      --cycle: 2.4s;
      --half-cycle: -1.2s;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 280px;
      min-height: 100svh;
      color: var(--ink);
      background: var(--paper);
      font-family: "Segoe UI", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .page { width: min(1280px, 100%); margin: 0 auto; padding: 0 48px; }
    .masthead {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 92px;
      border-bottom: 1px solid #dce2d2;
      gap: 20px;
    }
    .brand { display: flex; align-items: center; gap: 11px; font-size: 13px; font-weight: 700; letter-spacing: 2px; }
    .brand svg { width: 35px; height: 35px; }
    .edition { color: var(--muted); font-size: 10px; font-weight: 500; letter-spacing: 2px; text-align: right; }
    .intro { position: relative; z-index: 1; padding: 42px 0 0; text-align: center; }
    .eyebrow { margin: 0 0 12px; color: #819174; font-size: 10px; font-weight: 600; letter-spacing: 3.2px; }
    h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(35px, 4.6vw, 62px); font-weight: 400; line-height: 1.12; letter-spacing: -2px; }
    .subtitle { margin: 14px 0 0; color: var(--muted); font-size: 13px; line-height: 1.6; letter-spacing: .3px; }
    .scene { margin: -10px -24px 0; overflow: hidden; }
    .landscape { display: block; width: 100%; height: auto; overflow: hidden; }
    .footer { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 23px 0 29px; border-top: 1px solid #dce2d2; }
    .caption { display: flex; gap: 12px; align-items: center; color: #748369; font-size: 10px; letter-spacing: 1.6px; }
    .caption-dot { width: 6px; height: 6px; border-radius: 50%; background: #a7b98b; }
    .transport { display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-width: 112px; min-height: 40px; padding: 9px 16px; border: 1px solid #ced8c4; border-radius: 24px; cursor: pointer; font-size: 12px; font-weight: 500; user-select: none; transition: background .2s, border-color .2s; }
    .transport:hover { background: #eaf0df; border-color: #a8b895; }
    .transport svg { width: 12px; height: 12px; fill: currentColor; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    #ride-pause:focus-visible ~ .footer .transport { outline: 3px solid #85a461; outline-offset: 4px; }
    .play-icon, .resume-text, .motion-note { display: none; }
    #ride-pause:checked ~ .scene * { animation-play-state: paused !important; }
    #ride-pause:checked ~ .footer .pause-icon,
    #ride-pause:checked ~ .footer .pause-text { display: none; }
    #ride-pause:checked ~ .footer .play-icon,
    #ride-pause:checked ~ .footer .resume-text { display: inline; }

    /* Every moving SVG part uses a local origin inside a static translated group. */
    .clouds { animation: scenery 90s linear infinite; }
    .distant-hills { animation: scenery 48s linear infinite; }
    .near-hills { animation: scenery 26s linear infinite; }
    /* 1200 / (2π × 124 / 2.4) = 3.6966 seconds: road speed matches the tire. */
    .roadside { animation: scenery 3.6966s linear infinite; }
    .front-spin, .crank { animation: spin var(--cycle) linear infinite; }
    /* The small wheel has the same ground speed: 2.4 × 42 / 124. */
    .rear-spin { animation: spin .812903s linear infinite; }
    .pedal-level { animation: counter-spin var(--cycle) linear infinite; }
    .rig { animation: bicycle-bob var(--cycle) ease-in-out infinite; }
    .scarf { animation: scarf-wave .8s ease-in-out infinite alternate; }
    .eye-white { transform-box: fill-box; transform-origin: center; animation: blink 6.8s linear infinite; }
    .dragonfly { animation: hover 3.6s ease-in-out infinite; }
    .wing { transform-origin: 0 0; animation: wing-beat .15s ease-in-out infinite alternate; }
    .wing-other { animation-delay: -.075s; }
    .leg { --limb-color: #92c75f; }
    .leg-far { --limb-color: #6da653; }
    .limb-outline { fill: none; stroke: var(--frog-outline); stroke-linecap: round; }
    .limb-fill { fill: none; stroke: var(--limb-color); stroke-linecap: round; }
    .webbed-foot { fill: var(--limb-color); stroke: var(--frog-outline); stroke-width: 3; stroke-linejoin: round; }
    .thigh { animation: thigh-turn var(--cycle) linear infinite; }
    .shin { animation: shin-turn var(--cycle) linear infinite; }
    .foot { animation: foot-turn var(--cycle) linear infinite; }
    .leg-far .thigh, .leg-far .shin, .leg-far .foot { animation-delay: var(--half-cycle); }
    .spokes { fill: none; stroke: #8f9a78; stroke-width: 1.7; }
    .bike-outline { fill: none; stroke: #344c3d; stroke-width: 13; stroke-linecap: round; stroke-linejoin: round; }
    .bike-brass { fill: none; stroke: #cba465; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }

    @keyframes scenery { to { transform: translateX(-1200px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes counter-spin { to { transform: rotate(-360deg); } }
    @keyframes bicycle-bob { 0%, 50%, 100% { transform: translateY(0); } 25%, 75% { transform: translateY(-1.3px); } }
    @keyframes scarf-wave { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }
    @keyframes blink { 0%, 43%, 47%, 100% { transform: scaleY(1); } 44.5%, 45.5% { transform: scaleY(.06); } }
    @keyframes hover { 0%, 100% { transform: translate(0, 0) rotate(-3deg); } 50% { transform: translate(-13px, -15px) rotate(4deg); } }
    @keyframes wing-beat { from { transform: scaleY(1); } to { transform: scaleY(.3); } }

    /* Two-link leg geometry sampled around the crank; feet stay level on the pedals. */
    @keyframes thigh-turn {
      0% { transform: rotate(32.4280deg); }

      62.5% { transform: rotate(28.2280deg); }
      65.625% { transform: rotate(25.4095deg); }
      68.75% { transform: rotate(22.8983deg); }
      71.875% { transform: rotate(20.8488deg); }
      75% { transform: rotate(19.3987deg); }
      78.125% { transform: rotate(18.6492deg); }
      81.25% { transform: rotate(18.6537deg); }
      84.375% { transform: rotate(19.4169deg); }
      87.5% { transform: rotate(20.9021deg); }
      90.625% { transform: rotate(23.0413deg); }
      93.75% { transform: rotate(25.7457deg); }
      96.875% { transform: rotate(28.9126deg); }
      100% { transform: rotate(32.4280deg); }
    }

    @keyframes shin-turn {
      0% { transform: rotate(55.6254deg); }
      3.125% { transform: rotate(49.8969deg); }
      6.25% { transform: rotate(44.4543deg); }

      34.375% { transform: rotate(50.1676deg); }
      37.5% { transform: rotate(55.9042deg); }
      40.625% { transform: rotate(61.7120deg); }
      43.75% { transform: rotate(67.4275deg); }
      46.875% { transform: rotate(72.9093deg); }
      50% { transform: rotate(78.0266deg); }
      53.125% { transform: rotate(82.6521deg); }
      56.25% { transform: rotate(86.6606deg); }
      59.375% { transform: rotate(89.9311deg); }
      62.5% { transform: rotate(92.3531deg); }
      65.625% { transform: rotate(93.8362deg); }
      68.75% { transform: rotate(94.3210deg); }
      71.875% { transform: rotate(93.7874deg); }
      75% { transform: rotate(92.2575deg); }
      78.125% { transform: rotate(89.7925deg); }
      81.25% { transform: rotate(86.4839deg); }
      84.375% { transform: rotate(82.4429deg); }
      87.5% { transform: rotate(77.7908deg); }
      90.625% { transform: rotate(72.6532deg); }
      93.75% { transform: rotate(67.1570deg); }
      96.875% { transform: rotate(61.4338deg); }
      100% { transform: rotate(55.6254deg); }
    }

    @keyframes foot-turn {
      0% { transform: rotate(-88.0535deg); }
      3.125% { transform: rotate(-86.0625deg); }
      6.25% { transform: rotate(-84.4338deg); }
      9.375% { transform: rotate(-83.2637deg); }

    @media (max-width: 640px) {
      .page { padding: 0 22px; }
      .masthead { min-height: 76px; }
      .brand { font-size: 11px; letter-spacing: 1.5px; gap: 8px; }
      .edition { max-width: 115px; font-size: 8px; line-height: 1.7; letter-spacing: 1.4px; }
      .intro { padding-top: 38px; }
      .eyebrow { font-size: 8px; letter-spacing: 2.2px; }
      h1 { letter-spacing: -1.4px; }
      .subtitle { max-width: 260px; margin: 12px auto 0; font-size: 12px; }
      .scene { margin: 7px -22px 0; }
      .landscape { width: 170%; max-width: none; margin-left: -35%; }
      .footer { padding: 19px 0; gap: 10px; }
      .caption { font-size: 8px; letter-spacing: 1px; gap: 7px; }
      .transport { min-width: 94px; min-height: 40px; padding: 9px 12px; font-size: 11px; }

    @media (prefers-reduced-motion: reduce) {

<body>
  <div class="page">
    <header class="masthead">
      <div class="brand">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <path d="M7 22C3 14 10 7 17 13Q20 11 23 13C31 7 38 14 33 23Q36 33 20 34Q4 33 7 22Z" fill="#a9cd7b" stroke="#35583a" stroke-width="1.7" />
          <ellipse cx="12.5" cy="18" rx="5" ry="6" fill="#fbfae9" />
          <ellipse cx="27.5" cy="18" rx="5" ry="6" fill="#fbfae9" />
          <circle cx="14" cy="18.5" r="2.1" fill="#294f3c" />
          <circle cx="29" cy="18.5" r="2.1" fill="#294f3c" />
          <path d="M14 26Q20 30 26 26" fill="none" stroke="#35583a" stroke-width="1.7" stroke-linecap="round" />
        </svg>
        КВА! ВЕЛОКЛУБ
      </div>
      <span class="edition">МАЛЕНЬКИЕ ПУТЕШЕСТВИЯ &nbsp; / &nbsp; № 01</span>
    </header>

    <main>
      <input class="visually-hidden" type="checkbox" id="ride-pause" aria-label="Приостановить анимацию" />
      <div class="intro">
        <p class="eyebrow">НИКУДА НЕ ТОРОПИМСЯ</p>
        <h1>Попутного ветра.</h1>
        <p class="subtitle">Два колеса, зелёные лапки и целый день впереди.</p>
      </div>

      <figure class="scene" aria-label="Лягушка на старинном велосипеде едет по загородной дорожке">
        <svg class="landscape" viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="scene-title scene-description">
          <title id="scene-title">Маленькая велосипедная прогулка</title>
          <desc id="scene-description">Зелёная лягушка с жёлтым животиком и большими глазами крутит педали пенни-фартинга. Большое переднее и маленькое заднее колёса вращаются, а облака, холмы и цветы плывут назад.</desc>
          <defs>
            <linearGradient id="sky" x2="0" y2="1">
              <stop stop-color="#f7f7ed" />
              <stop offset="1" stop-color="#eff2df" />
            </linearGradient>
            <linearGradient id="frog-green" x1="0" y1="0" x2=".8" y2="1">
              <stop stop-color="#b1d77d" />
              <stop offset="1" stop-color="#89bd5b" />
            </linearGradient>
            <linearGradient id="belly" x2=".5" y2="1">
              <stop stop-color="#f5efb3" />
              <stop offset="1" stop-color="#e7e59e" />
            </linearGradient>
            <path id="front-spoke" d="M0 0V-114" />
            <path id="rear-spoke" d="M0 0V-34" />
            <g id="cloud">
              <path d="M0 25C-1 15 10 10 20 13C22-5 47-7 54 10C68 3 82 13 79 24C95 21 104 30 96 34H5C-4 34-8 27 0 25Z" fill="#fffef7" />
              <path d="M7 39H70" fill="none" stroke="#e6ead9" stroke-width="1.5" stroke-linecap="round" />
            </g>
            <g id="cloud-strip">
              <use href="#cloud" x="90" y="134" />
              <use href="#cloud" transform="translate(413 68) scale(.72)" />
              <use href="#cloud" transform="translate(792 191) scale(.75)" />
              <use href="#cloud" transform="translate(1080 98) scale(.9)" />

            </g>

              <path d="M0-17C-34-18-24-61 0-89C24-60 34-19 0-17Z" fill="#bfcea8" />

            <g id="near-strip">

              <use href="#tree" transform="translate(183 507) scale(.65)" />

              <g fill="#a9c394">
                <ellipse cx="85" cy="528" rx="24" ry="12" /><ellipse cx="112" cy="532" rx="19" ry="10" />
                <ellipse cx="1085" cy="537" rx="27" ry="13" /><ellipse cx="1113" cy="542" rx="22" ry="10" />
              </g>
            </g>
            <g id="daisy">
              <path d="M0 0Q4-12 0-26M1-7Q-11-17-12-10Q-8-5 1-7" fill="none" stroke="#82996b" stroke-width="2" stroke-linecap="round" />
              <g transform="translate(0 -27)" fill="#fffdf0">
                <ellipse cy="-5" rx="3" ry="5" />
                <ellipse cy="-5" rx="3" ry="5" transform="rotate(72)" />
                <ellipse cy="-5" rx="3" ry="5" transform="rotate(144)" />
                <ellipse cy="-5" rx="3" ry="5" transform="rotate(216)" />
                <ellipse cy="-5" rx="3" ry="5" transform="rotate(288)" />
                <circle r="3.4" fill="#dcc471" />
              </g>
            </g>
            <g id="road-strip">
              <g fill="none" stroke="#a1b68a" stroke-width="2" stroke-linecap="round">
                <path d="M91 580 88 572M91 580 96 570M226 583 222 575M226 583 231 572M508 581 505 574M508 581 513 571M876 581 872 572M876 581 881 574M1134 581 1130 573M1134 581 1139 570" />
                <path d="M14 614H43M196 606H213M345 626H389M628 612H664M817 627H845M1032 612H1072" stroke="#c5ceb2" />

              <use href="#daisy" transform="translate(843 589) scale(.83)" />
              <use href="#daisy" transform="translate(865 587) scale(.52)" />
              <g fill="#b0bd98"><ellipse cx="474" cy="602" rx="3" ry="1.5" /><ellipse cx="925" cy="618" rx="4" ry="2" /></g>
            </g>
          </defs>

          <path fill="url(#sky)" d="M0 0H1200V640H0Z" />
          <circle cx="939" cy="134" r="53" fill="#efdfa0" opacity=".68" />
          <circle cx="939" cy="134" r="64" fill="none" stroke="#eee7bd" stroke-width="1" />
          <!-- Each landscape strip has an identical neighbour for seamless loops. -->
          <g class="clouds"><use href="#cloud-strip" /><use href="#cloud-strip" x="1200" /></g>
          <g class="distant-hills"><use href="#far-strip" /><use href="#far-strip" x="1200" /></g>
          <g class="near-hills"><use href="#near-strip" /><use href="#near-strip" x="1200" /></g>
          <path d="M0 589H1200V640H0Z" fill="#e9ecd9" />
          <path d="M0 589H1200" fill="none" stroke="#a7ba90" stroke-width="2" />
          <g class="roadside"><use href="#road-strip" /><use href="#road-strip" x="1200" /></g>
          <ellipse cx="559" cy="593" rx="218" ry="8" fill="#64754c" opacity=".1" />

          <g transform="translate(883 294)">

              <g class="wing" fill="#fffdf0" stroke="#c5d1b6" stroke-width="1.1">

          <g class="rig">
            <!-- Radial spokes rotate around each axle, in local SVG coordinates. -->
            <g transform="translate(379 547)">
              <circle r="42" fill="#f7f7ed" fill-opacity=".7" stroke="#344c3d" stroke-width="8" />
              <circle r="36.5" fill="none" stroke="#c3b88b" stroke-width="2" />
              <g class="rear-spin spokes">
              <use href="#rear-spoke" transform="rotate(0)" />
              <use href="#rear-spoke" transform="rotate(30)" />

              <use href="#rear-spoke" transform="rotate(300)" />
              <use href="#rear-spoke" transform="rotate(330)" />
                <circle cx="0" cy="-36.5" r="2" fill="#c8a16a" stroke="none" />
              </g>
              <circle r="6" fill="#c8a16a" stroke="#344c3d" stroke-width="3" />
            </g>
            <g transform="translate(650 465)">
              <circle r="124" fill="#f7f7ed" fill-opacity=".64" stroke="#344c3d" stroke-width="9" />
              <circle r="118" fill="none" stroke="#c3b88b" stroke-width="2.5" />
              <g class="front-spin spokes">
              <use href="#front-spoke" transform="rotate(0)" />
