<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8f5e9" />
    <title>По ветру — маленькое путешествие пеликана</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f8f5e9;
        --ink: #293e37;
        --muted: #738077;
        --cadence: 1.45s;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100svh;
        background: var(--paper);
        color: var(--ink);
        font-family: "Segoe UI", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .page {
        width: min(1320px, 100%);
        margin: 0 auto;
        padding: 30px 48px 24px;
      }

      .masthead, .brand, .edition, .caption, .journey, .pause-control {
        display: flex;
        align-items: center;
      }

      .masthead { justify-content: space-between; gap: 20px; }
      .brand { gap: 11px; font-size: 14px; font-weight: 700; letter-spacing: -.3px; }
      .brand svg { width: 35px; height: 35px; }
      .edition { gap: 9px; color: var(--muted); font-size: 10px; letter-spacing: 1.9px; }
      .edition::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: #d19a50; }

      .intro { text-align: center; padding: 42px 0 27px; }
      .eyebrow { margin: 0 0 10px; color: #849078; font-size: 10px; font-weight: 600; letter-spacing: 3.1px; }
      h1 { margin: 0; font: italic 400 clamp(52px, 7vw, 88px)/1.07 Georgia, "Times New Roman", serif; letter-spacing: -4px; }
      .subtitle { margin: 17px 0 0; font-size: 13px; color: var(--muted); letter-spacing: .25px; }

      .postcard { position: relative; }
      .scene {
        display: block;
        width: 100%;
        height: auto;
        overflow: hidden;
        border: 1px solid #dce4ce;
        border-radius: 17px;
        background: #eaf0df;
      }

      .scene-label {
        position: absolute;
        top: 25px;
        left: 28px;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 9px;
        color: #607463;
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 2px;
        pointer-events: none;
      }

      .scene-label::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #8ba381; }
      .caption { min-height: 69px; justify-content: space-between; gap: 20px; }
      .journey { gap: 14px; }
      .journey svg { width: 33px; height: 33px; }
      .journey strong { display: block; font-size: 12px; font-weight: 600; }
      .journey small { display: block; margin-top: 4px; font-size: 10px; color: var(--muted); }

      .pause-toggle { position: absolute; width: 1px; height: 1px; opacity: 0; }
      .pause-control {
        gap: 9px;
        min-height: 38px;
        padding: 8px 14px;
        border: 1px solid #d7dece;
        border-radius: 30px;
        font-size: 11px;
        cursor: pointer;
        user-select: none;
        transition: background-color .2s, border-color .2s;
      }

      .pause-control:hover { background: #e9eddf; border-color: #a3b69d; }
      .pause-symbol { display: block; width: 9px; height: 11px; border-left: 3px solid currentColor; border-right: 3px solid currentColor; }
      .resume-text { display: none; }
      .pause-toggle:focus-visible ~ .caption .pause-control { outline: 2px solid #55775e; outline-offset: 4px; }
      .pause-toggle:checked ~ .scene * { animation-play-state: paused !important; }
      .pause-toggle:checked ~ .caption .pause-text { display: none; }
      .pause-toggle:checked ~ .caption .resume-text { display: inline; }
      .pause-toggle:checked ~ .caption .pause-symbol { height: 0; border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-left: 9px solid currentColor; border-right: 0; }

      .footer { margin-top: 4px; padding-top: 19px; border-top: 1px solid #dfe2d5; text-align: center; font: italic 12px Georgia, serif; color: #939b89; }

      /* Every landscape tile is 1200 SVG units wide; identical neighbours make a seamless loop. */
      .clouds { animation: landscape 65s linear infinite; }
      .distant-hills { animation: landscape 38s linear infinite; }
      .near-hills { animation: landscape 19s linear infinite; }
      .verge { animation: landscape 8s linear infinite; }
      .road-marks { animation: landscape 2.885s linear infinite; }
      .foreground { animation: landscape 5s linear infinite; }
      @keyframes landscape { to { transform: translateX(-1200px); } }

      /* Local coordinates keep wheels, cranks and counter-rotating pedals concentric. */
      .wheel, .crank { transform-origin: 0px 0px; animation: turn var(--cadence) linear infinite; }
      .pedal-level { transform-origin: 0px 0px; animation: counter-turn var(--cadence) linear infinite; }
      @keyframes turn { to { transform: rotate(360deg); } }
      @keyframes counter-turn { to { transform: rotate(-360deg); } }

      .ride { animation: ride .725s ease-in-out infinite; }
      @keyframes ride { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }

      .leg { animation: pedal-leg var(--cadence) linear infinite; }
      .leg-back { animation-delay: -.725s; }
      /* Matching path commands interpolate the two joints; feet follow the crank's circle. */
      @keyframes pedal-leg {
        0%, 100% { d: path("M 554 365 Q 547 408 578 436 Q 612 468 623 503"); }
        12.5% { d: path("M 554 365 Q 532 413 562 447 Q 597 491 610.7 532.7"); }
        25% { d: path("M 554 365 Q 519 414 539 453 Q 569 505 581 545"); }
        37.5% { d: path("M 554 365 Q 506 405 519 447 Q 540 494 551.3 532.7"); }
        50% { d: path("M 554 365 Q 499 388 503 429 Q 515 472 539 503"); }
        62.5% { d: path("M 554 365 Q 512 382 519 414 Q 533 451 551.3 473.3"); }
        75% { d: path("M 554 365 Q 530 385 545 417 Q 570 440 581 461"); }
        87.5% { d: path("M 554 365 Q 547 392 571 428 Q 604 449 610.7 473.3"); }
      }

      .wing { transform-origin: 568px 330px; animation: wing-sway 2.9s ease-in-out infinite; }
      @keyframes wing-sway { 0%, 100% { transform: rotate(-1deg); } 50% { transform: rotate(1.5deg); } }

      .scarf-tail { transform-origin: 615px 281px; animation: scarf .725s ease-in-out infinite alternate; }
      @keyframes scarf { from { transform: rotate(-3deg); } to { transform: rotate(4deg); } }

      .eye { transform-origin: 650px 201px; animation: blink 5.8s ease-in-out infinite; }
      @keyframes blink { 0%, 43%, 47%, 100% { transform: scaleY(1); } 45% { transform: scaleY(.08); } }

      .wind { animation: wind 2.9s ease-out infinite; }
      .wind-later { animation-delay: -1.45s; }
      @keyframes wind { 0% { opacity: 0; transform: translateX(25px); } 25% { opacity: .65; } 80%, 100% { opacity: 0; transform: translateX(-75px); } }

      @media (min-width: 1000px) and (max-height: 950px) {
        .page { max-width: 1140px; padding-top: 22px; }
        .intro { padding-top: 25px; padding-bottom: 24px; }
        h1 { font-size: 65px; }
        .scene { max-height: 61svh; }
      }

      @media (max-width: 600px) {
        .page { padding: 22px 18px; }
        .brand { font-size: 12px; }
        .edition { font-size: 8px; letter-spacing: 1px; }
        .intro { padding: 39px 0 27px; }
        h1 { letter-spacing: -2px; }
        .subtitle { font-size: 11px; }
        .scene { aspect-ratio: 1 / 1; object-fit: cover; }
        .scene-label { top: 18px; left: 18px; font-size: 8px; letter-spacing: 1.4px; }
        .journey { gap: 8px; }
        .journey strong { font-size: 11px; }
        .journey small { font-size: 9px; }
        .pause-control { padding: 8px 11px; }
        .footer { margin-top: 14px; }
      }

      @media (prefers-reduced-motion: reduce) {
        .scene * { animation: none !important; }
        .pause-control { display: none; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="masthead">
        <div class="brand">
          <svg viewBox="0 0 36 36" fill="none" aria-hidden="true">
            <rect x=".5" y=".5" width="35" height="35" rx="11" stroke="#cfd8c4" />
            <path d="M8 15h15c6 0 6-8 1-8-2 0-3 1-3 3M8 20h20M8 25h9c5 0 5 6 1 6" stroke="#617c62" stroke-width="1.5" stroke-linecap="round" />
          </svg>
          тихий ход
        </div>
        <span class="edition">ЗАРИСОВКА 001</span>
      </header>

      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">МАЛЕНЬКОЕ ПУТЕШЕСТВИЕ</p>
        <h1 id="page-title">По ветру.</h1>
        <p class="subtitle">Большой клюв. Два колеса. Никакой спешки.</p>
      </section>

      <section class="postcard" aria-label="Анимированная открытка">
        <input class="pause-toggle" type="checkbox" id="pause" aria-label="Приостановить анимацию" aria-controls="pelican-scene" />
        <div class="scene-label" aria-hidden="true">ГДЕ-ТО ПО ДОРОГЕ К МОРЮ</div>

        <svg class="scene" id="pelican-scene" viewBox="0 0 1200 720" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="scene-title scene-description">
          <title id="scene-title">Пеликан на велосипеде</title>
          <desc id="scene-description">Белый мультяшный пеликан с большим золотистым зобом и зелёным шарфом крутит педали кораллового велосипеда. Радиальные спицы вращаются, а облака, холмы и цветы плывут влево.</desc>

          <defs>
            <linearGradient id="sky" x2="0" y2="1">
              <stop stop-color="#e7efdf" />
              <stop offset="1" stop-color="#f8f1d7" />
            </linearGradient>
            <linearGradient id="pouch" x2=".3" y2="1">
              <stop stop-color="#f6c75c" />
              <stop offset="1" stop-color="#eaaa45" />
            </linearGradient>
            <linearGradient id="feathers" x2=".7" y2="1">
              <stop stop-color="#fffdf2" />
              <stop offset="1" stop-color="#f4ebca" />
            </linearGradient>

            <g id="cloud-tile" fill="#fffdf2" opacity=".75">
              <path d="M97 163c-16 0-16-18-2-21-2-18 23-25 32-9 12-12 34-4 32 12 22-3 25 18 10 18Z" />
              <path d="M420 102c-16 0-19-20-1-24 2-21 32-27 43-6 19-9 37 0 36 14 18-1 24 16 8 16Z" />
              <path d="M1000 191c-22 0-23-21-4-24 0-22 31-31 44-11 20-9 35 2 35 15 22-2 28 20 8 20Z" />
            </g>

            <g id="distant-tile">
              <path d="M0 426C104 426 139 314 250 314S420 444 549 395 706 308 799 331 977 435 1076 382C1120 359 1153 426 1200 426V720H0Z" fill="#d3dfc3" />
              <path d="M0 426C104 426 139 314 250 314S420 444 549 395 706 308 799 331 977 435 1076 382C1120 359 1153 426 1200 426" fill="none" stroke="#cbd9ba" stroke-width="2" />
            </g>

            <g id="near-tile">
              <path d="M0 469C116 425 206 450 336 473S530 420 660 425 890 503 1020 465 1143 454 1200 469V720H0Z" fill="#b8cba7" />
              <path d="M0 511C179 484 255 517 401 514S700 480 866 510 1060 492 1200 511V720H0Z" fill="#ced9b0" />
              <g fill="none" stroke="#8fab8d" stroke-width="3" stroke-linecap="round" opacity=".65">
                <path d="M121 449v-48m0 22-13-11m13 23 15-15M1001 456v-47m0 17-12-9m12 23 14-13" />
              </g>
              <g fill="#a9c19e"><ellipse cx="120" cy="397" rx="22" ry="37" /><ellipse cx="1000" cy="405" rx="20" ry="31" /></g>
            </g>

            <g id="verge-tile" stroke-linecap="round">
              <g fill="#8eac7f">
                <path d="M116 548c-9-24 5-44 15-35 7-26 25-25 28-3 18-13 31 0 24 18 18-4 26 9 20 20Z" />
                <path d="M908 550c-11-20 0-39 13-30 2-25 27-28 31-6 11-9 25-2 25 12 17-2 24 14 15 24Z" />
              </g>
              <g fill="none" stroke="#9bad80" stroke-width="2.5">
                <path d="m52 557-6-12m6 12 8-10m296 7-7-15m7 15 9-9m690 14-4-17m4 17 11-11M714 553v-18m0 18-9-11" />
              </g>
              <g fill="#fff4ca"><circle cx="711" cy="533" r="4" /><circle cx="1049" cy="539" r="4" /><circle cx="366" cy="542" r="3" /></g>
            </g>

            <g id="road-tile" fill="none" stroke-linecap="round">
              <path d="M20 622h66m149 0h31m123 0h80m165 0h44m153 0h92m192 0h38" stroke="#d3c4a3" stroke-width="3" />
              <path d="M126 588h22m344 10h34m432-12h30m-755 59h20m500 1h39m356-43h18" stroke="#e4d7b9" stroke-width="3" />
            </g>

            <g id="flower" fill="none" stroke-linecap="round">
              <path d="M0 0v-32M0-9q-12-1-12-11M0-15q12 0 13-11" stroke="#81956a" stroke-width="2.5" />
              <g transform="translate(0 -34)" fill="#fff8de">
                <ellipse cy="-6" rx="3.5" ry="6" /><ellipse cy="6" rx="3.5" ry="6" />

                <circle r="3.5" fill="#dcb45e" />
              </g>
            </g>

            <g id="foreground-tile">
              <g fill="none" stroke="#8a9e71" stroke-width="3" stroke-linecap="round">
                <path d="M54 700q0-20-9-26m9 26q1-29 15-38m-15 38q10-15 21-15M1003 687q-1-22-10-29m10 29q0-17 12-28m-12 28q10-9 16-8M625 704l-3-14m3 14 10-19" />
              </g>
              <use href="#flower" transform="translate(183 689) rotate(-9)" />
              <use href="#flower" transform="translate(210 695) scale(.75) rotate(12)" />
              <use href="#flower" transform="translate(832 684) scale(.85) rotate(8)" />
              <g fill="#c1cba0"><ellipse cx="432" cy="682" rx="6" ry="2" /><ellipse cx="1140" cy="696" rx="9" ry="3" /></g>
            </g>

            <!-- Sixteen genuinely radial spokes, all rotating together around the hub. -->
            <g id="wheel-spokes" fill="none" stroke="#839384" stroke-width="1.7">
              <path d="M-86 0H86M0-86V86M-60.81-60.81 60.81 60.81M-60.81 60.81 60.81-60.81M-79.45-32.91 79.45 32.91M-79.45 32.91 79.45-32.91M-32.91-79.45 32.91 79.45M-32.91 79.45 32.91-79.45" />
              <circle r="86" stroke="#f7edcd" stroke-width="5" />
              <path d="M0-87v8" stroke="#cf8351" stroke-width="4" stroke-linecap="round" />
            </g>

            <g id="webbed-foot" stroke="#725c35" stroke-width="2.5" stroke-linejoin="round">
              <rect x="-17" y="8" width="37" height="7" rx="3" fill="#46594d" stroke="#46594d" />
              <path d="M-6-7Q-2-10 3-6L10 0 24 5 17 9-14 7Z" fill="#edb955" />
              <path d="m6 1 10 4" fill="none" stroke="#c78f3f" stroke-width="1.5" />
            </g>
          </defs>

          <path fill="url(#sky)" d="M0 0h1200v720H0z" />
          <circle cx="916" cy="146" r="75" fill="#f4eac0" opacity=".55" />
          <circle cx="916" cy="146" r="54" fill="#f2d887" />
          <g class="clouds"><use href="#cloud-tile" /><use href="#cloud-tile" x="1200" /></g>
          <g class="distant-hills"><use href="#distant-tile" /><use href="#distant-tile" x="1200" /></g>
          <g class="near-hills"><use href="#near-tile" /><use href="#near-tile" x="1200" /></g>
          <path d="M0 545h1200v175H0Z" fill="#dbe0b5" />
          <g class="verge"><use href="#verge-tile" /><use href="#verge-tile" x="1200" /></g>
          <path d="M0 566h1200v94H0Z" fill="#e9dcbb" />
          <path d="M0 567h1200M0 660h1200" stroke="#d6cca8" stroke-width="2" />
          <g class="road-marks"><use href="#road-tile" /><use href="#road-tile" x="1200" /></g>

          <ellipse cx="592" cy="603" rx="264" ry="13" fill="#667952" opacity=".14" />

          <g class="wind" fill="none" stroke="#93a88c" stroke-width="2.5" stroke-linecap="round">
            <path d="M343 290h69m-95 16h39m-21 94h38" />
          </g>
          <g class="wind wind-later" fill="none" stroke="#93a88c" stroke-width="2" stroke-linecap="round">
            <path d="M874 364h57m-42 14h23m-89 68h44" />
          </g>

          <g class="ride">
            <!-- The far leg and pedal sit behind the bicycle frame. -->
            <path class="leg leg-back" d="M554 365Q499 388 503 429Q515 472 539 503" fill="none" stroke="#a67539" stroke-width="15" stroke-linecap="round" />
            <g transform="translate(581 503)">
              <g class="crank">
                <path d="M0 0H-42" stroke="#607065" stroke-width="8" stroke-linecap="round" />
                <g transform="translate(-42 0)"><g class="pedal-level"><use href="#webbed-foot" /></g></g>
              </g>
            </g>

            <g transform="translate(422 502)">
              <circle r="95" fill="#f9f1d8" fill-opacity=".3" stroke="#354b41" stroke-width="12" />
              <circle r="89" fill="none" stroke="#fff3ce" stroke-width="3" />
              <g class="wheel"><use href="#wheel-spokes" /></g>
              <circle r="8" fill="#f4e9c6" stroke="#526a57" stroke-width="3" />
            </g>
            <g transform="translate(758 502)">
              <circle r="95" fill="#f9f1d8" fill-opacity=".3" stroke="#354b41" stroke-width="12" />
              <circle r="89" fill="none" stroke="#fff3ce" stroke-width="3" />
              <g class="wheel"><use href="#wheel-spokes" /></g>
              <circle r="8" fill="#f4e9c6" stroke="#526a57" stroke-width="3" />
            </g>

            <!-- Mudguards, chain and the two triangles of the coral frame. -->
            <g fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path d="M320 486a103 103 0 0 1 201-12M658 475a103 103 0 0 1 202 15" stroke="#69806a" stroke-width="7" />
              <path d="m422 502 128-20q53-7 55 21t-30 25L422 513q-14-2-12-9t12-2Z" stroke="#758170" stroke-width="3" />
              <path d="m422 502 112-114 47 115H422l-19-53" stroke="#a34e3b" stroke-width="11" />
              <path d="m422 502 112-114 47 115H422m112-114 173 9-126 105m126-105 51 104" stroke="#d87958" stroke-width="8" />
              <path d="m534 389-8-25m181 35-17-54q-5-13 9-17l29-4" stroke="#496152" stroke-width="8" />
              <path d="m727 324 19-3" stroke="#ac714b" stroke-width="11" />
              <path d="m422 502-59-93h-27m12 0h107" stroke="#6e8269" stroke-width="4" />
              <path d="m545 397 151 8" stroke="#efb092" stroke-width="2.5" />
            </g>
            <path d="M507 356q4-5 13-4l43 4q13 1 12 8-1 7-18 6l-43-4q-13-1-7-10Z" fill="#495747" />
            <path d="m514 355 43 4" stroke="#859179" stroke-width="2" stroke-linecap="round" />
            <circle cx="696" cy="334" r="7" fill="#efc96c" stroke="#60715a" stroke-width="2" />
            <circle cx="581" cy="503" r="27" fill="#eff0d3" stroke="#72816a" stroke-width="3" />
            <circle cx="581" cy="503" r="20" fill="#cbd3b3" stroke="#a1af94" stroke-width="2" />

            <!-- A curved, articulated leg stays in step with the near crank. -->
            <path class="leg" d="M554 365Q547 408 578 436Q612 468 623 503" fill="none" stroke="#8f713d" stroke-width="18" stroke-linecap="round" />
            <path class="leg" d="M554 365Q547 408 578 436Q612 468 623 503" fill="none" stroke="#efbc59" stroke-width="12" stroke-linecap="round" />
            <g transform="translate(581 503)">
              <g class="crank">
                <path d="M0 0H42" stroke="#4c6152" stroke-width="8" stroke-linecap="round" />
                <path d="M4-2H37" stroke="#a0ac8f" stroke-width="2" stroke-linecap="round" />
                <g transform="translate(42 0)"><g class="pedal-level"><use href="#webbed-foot" /></g></g>
              </g>
            </g>
            <circle cx="581" cy="503" r="7" fill="#efe8c7" stroke="#53694f" stroke-width="3" />

            <!-- Tail, round body and tall neck are one softly outlined silhouette. -->

            <path d="M612 238c10 32 6 60-13 82-24 28-58 44-92 28 10 17 29 26 49 26 43 1 67-20 80-43 17-30 21-59 25-81Z" fill="#e9dfb9" opacity=".6" />
            <path d="m481 324 15 10m-7-22 13 11" fill="none" stroke="#c6c9af" stroke-width="2.5" stroke-linecap="round" />

            <g class="scarf-tail" stroke="#456f5a" stroke-width="2.5" stroke-linejoin="round">
              <path d="M620 279C594 272 574 277 550 263 542 258 532 258 523 260L533 270 521 278C555 291 582 282 614 291Z" fill="#719878" />
              <path d="M613 282c-22 1-35 15-62 15l11 7-5 10c30-1 38-21 62-22Z" fill="#91ad81" />
              <path d="m537 270 22 8" fill="none" stroke="#b1c4a0" stroke-width="2" />
            </g>
            <path d="M611 272q20 14 51 4l-3 15q-28 10-48-5Z" fill="#719878" stroke="#456f5a" stroke-width="2.5" />
            <path d="m618 280 6 3m7 2 6 1m7-1 6-1" stroke="#bacba7" stroke-width="2" stroke-linecap="round" />

            <!-- The near wing reaches forward to the handlebars. -->
            <g class="wing">
              <path d="M548 316c15-10 31 2 44 16 19 18 48 17 74 5l54-18c10-4 18-1 19 4 1 7-15 9-25 11-28 11-46 32-77 36-35 4-72-5-86-24-8-12-11-23-3-30Z" fill="#fbf5dd" stroke="#75806a" stroke-width="3" stroke-linejoin="round" />
              <path d="M561 327c18 21 39 31 67 29m-61-16c17 17 33 21 52 22m69-24 29-9" fill="none" stroke="#d3ceb0" stroke-width="2.5" stroke-linecap="round" />
            </g>
