<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Пеликан-Т800 :: SKYNET ZONE 7</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  :root{
    --rust:#8a5a2b;
    --rust-d:#5d3a1a;
    --iron:#3a3530;
    --sky-top:#1a0a0a;
    --sky-mid:#3a1212;
    --sky-bot:#6b2818;
    --bone:#f5e6c8;
    --bone-pale:#ede0b0;
    --pouch:#e8c87a;
    --term-red:#ff2020;
    --hud:#ff6a00;
  }

  html,body{
    width:100%; height:100%;
    background:#000;
    overflow:hidden;
    font-family:'Courier New',monospace;
  }

  .scene{
    position:relative;
    width:100vw; height:100vh;
    background:linear-gradient(180deg,var(--sky-top) 0%, var(--sky-mid) 45%, var(--sky-bot) 72%, #2a1a10 78%, #1a1208 100%);
    overflow:hidden;
  }

  /* ===== SCANLINES OVERLAY ===== */
  .scanlines{
    position:absolute; inset:0;
    pointer-events:none; z-index:100;
    background:repeating-linear-gradient(
      0deg,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,.18) 3px,
      rgba(0,0,0,0) 4px
    );
  }

  /* ===== GLITCH FLASH ===== */
  .glitch{
    position:absolute; inset:0;
    pointer-events:none; z-index:101;
    background:rgba(255,40,0,.06);
    animation:glitch 6s infinite;
  }
  @keyframes glitch{
    0%,93%,100%{opacity:0}
    94%{opacity:1; transform:translateX(-3px)}
    95%{opacity:.5; transform:translateX(2px)}
    96%{opacity:.8; transform:translateX(-1px)}
    97%{opacity:0}
  }

  /* ===== VIGNETTE ===== */
  .vignette{
    position:absolute; inset:0;
    pointer-events:none; z-index:99;
    background:radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,.7) 100%);
  }

  /* ===== SUN ===== */
  .sun{
    position:absolute;
    top:38%; left:50%;
    transform:translate(-50%,-50%);
    width:140px; height:140px;
    border-radius:50%;
    background:radial-gradient(circle, #ff6020 0%, #cc3010 50%, #801808 80%, transparent 100%);
    filter:blur(2px);
    animation:sunPulse 4s ease-in-out infinite;
    z-index:1;
  }
  @keyframes sunPulse{
    0%,100%{opacity:.8; transform:translate(-50%,-50%) scale(1)}
    50%{opacity:1; transform:translate(-50%,-50%) scale(1.06)}
  }
  .sun::before{
    content:''; position:absolute; inset:-20px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,80,20,.2) 0%, transparent 70%);
  }

  /* ===== FAR RUINS ===== */
  .layer-far{
    position:absolute; bottom:22%; left:0;
    width:200%; height:180px;
    z-index:2;
    animation:scrollFar 18s linear infinite;
  }
  @keyframes scrollFar{
    from{transform:translateX(0)}
    to{transform:translateX(-50%)}
  }

  /* ===== MID RUINS ===== */
  .layer-mid{
    position:absolute; bottom:18%; left:0;
    width:200%; height:220px;
    z-index:3;
    animation:scrollMid 9s linear infinite;
  }
  @keyframes scrollMid{
    from{transform:translateX(0)}
    to{transform:translateX(-50%)}
  }

  /* ===== NEAR RUINS ===== */
  .layer-near{
    position:absolute; bottom:13%; left:0;
    width:200%; height:120px;
    z-index:4;
    animation:scrollNear 5s linear infinite;
  }
  @keyframes scrollNear{
    from{transform:translateX(0)}
    to{transform:translateX(-50%)}
  }

  .ruin-svg{ display:block; width:100%; height:100%; }

  /* ===== GROUND ===== */
  .ground{
    position:absolute; bottom:0; left:0;
    width:100%; height:22%;
    background:linear-gradient(180deg, #2a1a10 0%, #1a1008 60%, #0a0604 100%);
    z-index:5;
  }
  .ground-lines{
    position:absolute; bottom:14%; left:0;
    width:200%; height:6px;
    z-index:5;
    animation:scrollGround 1.2s linear infinite;
  }
  @keyframes scrollGround{
    from{transform:translateX(0)}
    to{transform:translateX(-50%)}
  }

  /* ===== DUST ===== */
  .dust{
    position:absolute; bottom:15%; left:30%;
    width:100px; height:40px;
    z-index:6; pointer-events:none;
  }
  .dust p{
    position:absolute; border-radius:50%;
    background:rgba(200,160,100,.25);
  }
  .dust p:nth-child(1){ width:18px;height:18px; left:0; bottom:0; animation:dust 1s ease-out infinite; }
  .dust p:nth-child(2){ width:12px;height:12px; left:10px; bottom:0; animation:dust 1s ease-out .2s infinite; }
  .dust p:nth-child(3){ width:8px;height:8px; left:20px; bottom:0; animation:dust 1s ease-out .4s infinite; }
  .dust p:nth-child(4){ width:14px;height:14px; left:5px; bottom:0; animation:dust 1.2s ease-out .6s infinite; }
  .dust p:nth-child(5){ width:6px;height:6px; left:25px; bottom:0; animation:dust .8s ease-out .8s infinite; }
  @keyframes dust{
    0%{transform:translate(0,0) scale(1); opacity:.7}
    100%{transform:translate(-60px,-10px) scale(2); opacity:0}
  }

  /* ===== PELICAN RIDER ===== */
  .rider{
    position:absolute;
    bottom:16%; left:50%;
    transform:translateX(-50%);
    width:340px; height:380px;
    z-index:8;
    animation:bob .5s ease-in-out infinite;
  }
  @keyframes bob{
    0%,100%{transform:translateX(-50%) translateY(0)}
    50%{transform:translateX(-50%) translateY(-3px)}
  }

  .pelican-svg{ width:100%; height:100%; display:block; }

  /* Wheel spin */
  .wheel-f{ transform-origin:100px 280px; animation:spin .5s linear infinite; }
  .wheel-r{ transform-origin:240px 280px; animation:spin .5s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* Pedal spin */
  .pedal-group{ transform-origin:170px 280px; animation:spin .5s linear infinite; }

  /* Legs */
  .leg-front{ transform-origin:170px 260px; animation:legFront .5s linear infinite; }
  .leg-back{ transform-origin:170px 260px; animation:legBack .5s linear infinite; }
  @keyframes legFront{
    0%{transform:rotate(0deg)} 25%{transform:rotate(-35deg)} 50%{transform:rotate(0deg)} 75%{transform:rotate(35deg)} 100%{transform:rotate(0deg)}
  }
  @keyframes legBack{
    0%{transform:rotate(0deg)} 25%{transform:rotate(35deg)} 50%{transform:rotate(0deg)} 75%{transform:rotate(-35deg)} 100%{transform:rotate(0deg)}
  }

  /* Head bob */
  .head-group{ transform-origin:200px 160px; animation:headBob 1s ease-in-out infinite; }
  @keyframes headBob{
    0%,100%{transform:rotate(-1deg)}
    50%{transform:rotate(2deg)}
  }

  /* Pouch wobble */
  .pouch-group{ transform-origin:170px 200px; animation:pouchWobble 1s ease-in-out infinite; }
  @keyframes pouchWobble{
    0%,100%{transform:rotate(0deg) translateY(0)}
    50%{transform:rotate(1deg) translateY(-2px)}
  }

  /* Terminator eye */
  .term-eye{ animation:eyeBlink 2s ease-in-out infinite; }
  @keyframes eyeBlink{
    0%,90%,100%{opacity:1}
    93%{opacity:.2}
    95%{opacity:1}
  }

  /* ===== HUD ===== */
  .hud{
    position:absolute; top:0; left:0; right:0; bottom:0;
    z-index:98; pointer-events:none;
    color:var(--hud);
    font-size:12px; letter-spacing:1px;
    text-shadow:0 0 4px rgba(255,106,0,.6);
  }
  .hud-tl{ position:absolute; top:14px; left:16px; }
  .hud-tr{ position:absolute; top:14px; right:16px; text-align:right; }
  .hud-bl{ position:absolute; bottom:14px; left:16px; }
  .hud-br{ position:absolute; bottom:14px; right:16px; text-align:right; }
  .hud h3{ font-size:14px; margin-bottom:4px; letter-spacing:2px; }
  .hud .label{ opacity:.6; }
  .hud .blink{ animation:blink 1s steps(2) infinite; }
  @keyframes blink{ 50%{opacity:.3} }
  .hud .bar{
    display:inline-block; width:120px; height:8px;
    border:1px solid var(--hud);
    margin-top:4px; position:relative;
  }
  .hud .bar::after{
    content:''; position:absolute; left:0; top:0; bottom:0;
    width:73%; background:var(--hud);
  }
</style>
</head>
