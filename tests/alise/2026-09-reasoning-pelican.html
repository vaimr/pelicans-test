<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мультяшный пеликан на велосипеде</title>
  <style>
    svg {
      display: block;
      width: 100%;
      height: 100vh;
    }

    /* Анимация фона */
    .background {
      animation: moveBackground 10s linear infinite;
    }
    @keyframes moveBackground {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }

    /* Вращение колёс */
    .wheel {
      animation: rotateWheel 2s linear infinite;
    }
    @keyframes rotateWheel {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Движение ног (педалирование) */
    .leg {
      animation: pedal 2s linear infinite;
    }
    @keyframes pedal {
      0%, 100% { transform: translateY(0); }
      25% { transform: translateY(-50px); }
      75% { transform: translateY(50px); }
    }
  </style>
</head>
<body>
  <svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
    <!-- Фон (имитация движения) -->
    <rect class="background" width="200%" height="100%" fill="url(#grassGradient)" />
    <defs>
      <linearGradient id="grassGradient" x1="0" x2="1" y1="0" y2="0">
        <stop offset="0%" stop-color="lightgreen" />
        <stop offset="50%" stop-color="lightblue" />
        <stop offset="100%" stop-color="lightgreen" />
      </linearGradient>
    </defs>

    <!-- Велосипед -->
    <g class="bike" transform="translate(200, 300)">
      <!-- Левое колесо -->
      <g class="wheel left">
        <circle cx="-50" cy="0" r="30" fill="none" stroke="#333" stroke-width="3" />
        <!-- Спицы -->
        <line x1="-50" y1="0" x2="-80" y2="-30" stroke="#333" stroke-width="2" />
        <line x1="-50" y1="0" x2="-80" y2="-15" stroke="#333" stroke-width="2" />
        <line x1="-50" y1="0" x2="-80" y2="0" stroke="#333" stroke-width="2" />
        <line x1="-50" y1="0" x2="-80" y2="15" stroke="#333" stroke-width="2" />
        <line x1="-50" y1="0" x2="-80" y2="30" stroke="#333" stroke-width="2" />
      </g>

      <!-- Правое колесо -->
      <g class="wheel right">
        <circle cx="50" cy="0" r="30" fill="none" stroke="#333" stroke-width="3" />
        <line x1="50" y1="0" x2="80" y2="-30" stroke="#333" stroke-width="2" />
        <line x1="50" y1="0" x2="80" y2="-15" stroke="#333" stroke-width="2" />
        <line x1="50" y1="0" x2="80" y2="0" stroke="#333" stroke-width="2" />
        <line x1="50" y1="0" x2="80" y2="15" stroke="#333" stroke-width="2" />
        <line x1="50" y1="0" x2="80" y2="30" stroke="#333" stroke-width="2" />
      </g>

      <!-- Рама и сиденье -->
      <path d="M -50 0 L 50 0 M 0 0 L 0 -30" stroke="#333" stroke-width="3" fill="none" />
    </g>

    <!-- Пеликан -->
    <g class="pelican" transform="translate(250, 250)">
      <!-- Тело (зоб) -->
      <ellipse cx="0" cy="0" rx="50" ry="30" fill="#FFD700" />

      <!-- Голова -->
      <circle cx="0" cy="-30" r="20" fill="#FFD700" />

      <!-- Клюв -->
      <path d="M 0 -50 L 20 -60 L -20 -60 Z" fill="#FFA500" />

      <!-- Глаза -->
      <circle cx="-10" cy="-40" r="5" fill="white" />
      <circle cx="10" cy="-40" r="5" fill="white" />

      <!-- Ноги (педалирование) -->
      <line class="leg left" x1="-20" y1="30" x2="-20" y2="60" stroke="black" stroke-width="4" />
      <line class="leg right" x1="20" y1="30" x2="20" y2="60" stroke="black" stroke-width="4" />
    </g>
  </svg>
</body>
</html>
