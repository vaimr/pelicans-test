<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Постапокалиптический пеликан</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: radial-gradient(circle, #333, #111);
    }
    svg {
      width: 100%;
      max-width: 800px;
      height: auto;
    }

    /* Анимация фона */
    #background {
      animation: moveBg 10s linear infinite;
    }
    @keyframes moveBg {
      0% { transform: translateX(0); }
      100% { transform: translateX(-800px); }
    }

    /* Вращение колёс */
    #wheelLeft, #wheelRight {
      animation: spin 2s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Движение ног (педалирование) */
    #legs {
      animation: pedal 1.5s linear infinite;
    }
    @keyframes pedal {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(30px); }
    }
  </style>
</head>
<body>
  <svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="groundGradient" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#888" />
        <stop offset="100%" stop-color="#666" />
      </linearGradient>
    </defs>

    <!-- Фон: постапокалиптический пейзаж -->
    <g id="background">
      <!-- Земля с трещинами -->
      <rect x="0" y="300" width="1600" height="100" fill="url(#groundGradient)" />
      <g stroke="#444" stroke-dasharray="20 10">
        <line x1="0" y1="300" x2="1600" y2="300" />
        <line x1="100" y1="310" x2="1700" y2="310" />
      </g>

      <!-- Разрушенные конструкции Скайнет -->
      <rect x="100" y="200" width="50" height="100" fill="#555" rx="10" />
      <rect x="300" y="150" width="70" height="150" fill="#666" rx="15" />

      <!-- Дым от разрушений -->
      <circle cx="200" cy="50" r="30" fill="rgba(255,255,255,0.5)" />
      <circle cx="500" cy="80" r="20" fill="rgba(255,255,255,0.3)" />
    </g>

    <!-- Велосипед -->
    <g id="bicycle" transform="translate(200, 150)">
      <!-- Рама (ржавый металл) -->
      <path d="M 0,0 L 100,0 A 50 50 0 0 1 150,50 L 150,100"
            stroke="silver" stroke-width="3" fill="none" />

      <!-- Левое колесо -->
      <g id="wheelLeft" transform="translate(-50, 50)">
        <circle cx="0" cy="0" r="50" fill="none" stroke="silver" stroke-width="3" />
        <circle cx="0" cy="0" r="4" fill="black" />
        <!-- Спицы -->
        <g stroke="silver" stroke-width="1">
          <line x1="0" y1="0" x2="-50" y2="-50" />
          <line x1="0" y1="0" x2="0" y2="-50" />
          <line x1="0" y1="0" x2="50" y2="-50" />
          <line x1="0" y1="0" x2="50" y2="50" />
          <line x1="0" y1="0" x2="0" y2="50" />
          <line x1="0" y1="0" x2="-50" y2="50" />
          <line x1="0" y1="0" x2="-50" y2="0" />
          <line x1="0" y1="0" x2="50" y2="0" />
        </g>
      </g>

      <!-- Правое колесо (аналогично) -->
      <g id="wheelRight" transform="translate(100, 50)">
        <circle cx="0" cy="0" r="50" fill="none" stroke="silver" stroke-width="3" />
        <circle cx="0" cy="0" r="4" fill="black" />
        <g stroke="silver" stroke-width="1">
          <line x1="0" y1="0" x2="-50" y2="-50" />
          <line x1="0" y1="0" x2="0" y2="-50" />
          <line x1="0" y1="0" x2="50" y2="-50" />
          <line x1="0" y1="0" x2="50" y2="50" />
          <line x1="0" y1="0" x2="0" y2="50" />
          <line x1="0" y1="0" x2="-50" y2="50" />
          <line x1="0" y1="0" x2="-50" y2="0" />
          <line x1="0" y1="0" x2="50" y2="0" />
        </g>
      </g>

      <!-- Педали (серебро с ржавчиной) -->
      <rect x="-20" y="-20" width="40" height="20" fill="silver" rx="5" />
      <rect x="20" y="20" width="40" height="20" fill="silver" rx="5" transform="rotate(180 -20 -20)" />
    </g>

    <!-- Мультяшный пеликан -->
    <g id="pelican" transform="translate(150, 100)">
      <!-- Тело (светло-жёлтый) -->
      <ellipse cx="0" cy="0" rx="50" ry="30" fill="#FFD700" stroke="#FFD700" stroke-width="2" />
      <!-- Большой зоб (белый) -->
      <ellipse cx="0" cy="30" rx="60" ry="20" fill="#FFF" stroke="#FFF" stroke-width="2" />
      <!-- Голова (жёлтый) -->
      <circle cx="-30" cy="-30" r="20" fill="#FFD700" stroke="#FFD700" stroke-width="2" />
      <!-- Клюв (оранжевый) -->
      <polygon points="-50,-50 -30,-30 -10,-50" fill="orange" stroke="orange" stroke-width="2" />
      <!-- Глаза (чёрные) -->
      <circle cx="-40" cy="-40" r="5" fill="black" />

      <!-- Ноги (движение) -->
      <g id="legs">
        <line x1="-20" y1="60" x2="-20" y2="100" stroke="black" stroke-width="5" />
        <line x1="20" y1="60" x2="20" y2="100" stroke="black" stroke-width="5" />
      </g>
    </g>
  </svg>
</body>
</html>
