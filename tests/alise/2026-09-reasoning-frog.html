<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лягушка на пенни-фартинге</title>
  <style>
    svg {
      width: 100%;
      height: 100vh;
      overflow: visible;
    }

    /* Анимация колёс */
    #frontWheel, #rearWheel {
      animation: rotateWheel 2s linear infinite;
    }
    @keyframes rotateWheel {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Анимация педалей */
    #pedals {
      transform-origin: 0 0;
      animation: pedalRotate 2s linear infinite;
    }
    @keyframes pedalRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Движение фона (имитация движения вперёд) */
    #movingTrees {
      animation: moveBackground 5s linear infinite;
    }
    @keyframes moveBackground {
      from { transform: translateX(0); }
      to { transform: translateX(-400px); } /* Сдвиг влево на ширину экрана */
    }
  </style>
</head>
<body>
  <svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
    <!-- Фон с движущимися деревьями -->
    <g id="background">
      <rect x="0" y="0" width="800" height="200" fill="skyblue" /> <!-- Небо -->
      <rect x="0" y="200" width="800" height="200" fill="lightgreen" /> <!-- Земля -->
      <g id="movingTrees">
        <!-- Деревья (3 копии для цикличности) -->
        <g>
          <rect x="-200" y="180" width="20" height="80" fill="saddlebrown" rx="10" />
          <polygon points="-200,260 -180,200 -160,260" fill="darkgreen" />
        </g>
        <g>
          <rect x="0" y="180" width="20" height="80" fill="saddlebrown" rx="10" />
          <polygon points="0,260 20,200 40,260" fill="darkgreen" />
        </g>
        <g>
          <rect x="200" y="180" width="20" height="80" fill="saddlebrown" rx="10" />
          <polygon points="200,260 220,200 240,260" fill="darkgreen" />
        </g>
      </g>
    </g>

    <!-- Велосипед (пенни-фартинг) -->
    <g id="bike">
      <!-- Переднее колесо (большое) с спицами -->
      <circle id="frontWheel" cx="400" cy="100" r="150" fill="none" stroke="black" stroke-width="5" />
      <g>
        <!-- Радиальные спицы (8 штук) -->
        <line x1="400" y1="100" x2="550" y2="100" stroke="black" stroke-width="2" />
        <line x1="400" y1="100" x2="400" y2="250" stroke="black" stroke-width="2" />
        <line x1="400" y1="100" x2="250" y2="100" stroke="black" stroke-width="2" />
        <line x1="400" y1="100" x2="400" y2="-50" stroke="black" stroke-width="2" />
        <!-- Диагональные спицы -->
        <line x1="400" y1="100" x2="506" y2="206" stroke="black" stroke-width="2" />
        <line x1="400" y1="100" x2="294" y2="206" stroke="black" stroke-width="2" />
        <line x1="400" y1="100" x2="294" y2="-6" stroke="black" stroke-width="2" />
        <line x1="400" y1="100" x2="506" y2="-6" stroke="black" stroke-width="2" />
      </g>

      <!-- Рама велосипеда -->
      <path d="M400,100 L400,200 A50 50 0 0 1 400 300 L400 350" stroke="black" stroke-width="5" fill="none" />

      <!-- Заднее колесо (маленькое) с спицами -->
      <circle id="rearWheel" cx="400" cy="300" r="50" fill="none" stroke="black" stroke-width="5" />
      <g>
        <line x1="400" y1="300" x2="450" y2="300" stroke="black" stroke-width="2" />
        <line x1="400" y1="300" x2="400" y2="350" stroke="black" stroke-width="2" />
        <line x1="400" y1="300" x2="350" y2="300" stroke="black" stroke-width="2" />
        <line x1="400" y1="300" x2="400" y2="250" stroke="black" stroke-width="2" />
        <line x1="400" y1="300" x2="435" y2="335" stroke="black" stroke-width="2" />
        <line x1="400" y1="300" x2="365" y2="335" stroke="black" stroke-width="2" />
        <line x1="400" y1="300" x2="365" y2="265" stroke="black" stroke-width="2" />
        <line x1="400" y1="300" x2="435" y2="265" stroke="black" stroke-width="2" />
      </g>

      <!-- Педали -->
      <g id="pedals" transform="translate(400, 100)">
        <circle cx="100" cy="0" r="20" fill="black" /> <!-- Правая педаль -->
        <circle cx="-100" cy="0" r="20" fill="black" /> <!-- Левая педаль -->
      </g>
    </g>

    <!-- Мультяшная лягушка -->
    <g id="frog">
      <!-- Тело (светло-жёлтое) -->
      <ellipse cx="400" cy="150" rx="60" ry="40" fill="lemonchiffon" />

      <!-- Большие глаза (белые) -->
      <circle cx="380" cy="140" r="20" fill="white" />
      <circle cx="420" cy="140" r="20" fill="white" />

      <!-- Зрачки (чёрные) и блики (белые) -->
      <circle cx="380" cy="140" r="8" fill="black" />
      <circle cx="420" cy="140" r="8" fill="black" />
      <circle cx="380" cy="135" r="3" fill="white" />
      <circle cx="420" cy="135" r="3" fill="white" />

      <!-- Ноги (зелёные), привязаны к педалям -->
      <line x1="350" y1="170" x2="300" y2="200" stroke="green" stroke-width="10" stroke-linecap="round" />
      <line x1="450" y1="170" x2="500" y2="200" stroke="green" stroke-width="10" stroke-linecap="round" />
    </g>
  </svg>
</body>
</html>
