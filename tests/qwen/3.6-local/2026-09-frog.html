<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лягушка на пенни-фартинге</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #87CEEB;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    svg {
      width: 100vw;
      height: 100vh;
      max-width: 100%;
      max-height: 100%;
    }

    /* --- Ключевые кадры --- */
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
    @keyframes scroll {
      100% { transform: translateX(-800px); }
    }
    @keyframes pedal {
      100% { transform: rotate(360deg); }
    }
    @keyframes leg-move {
      0%   { transform: rotate(25deg); }
      25%  { transform: rotate(-35deg); }
      50%  { transform: rotate(-75deg); }
      75%  { transform: rotate(-15deg); }
      100% { transform: rotate(25deg); }
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @keyframes blink {
      0%, 80%, 100% { transform: scaleY(1); }
      90% { transform: scaleY(0.1); }
    }

    /* --- Применение анимаций --- */
    .bg-layer { animation: scroll 3.5s linear infinite; }

    .wheel {
      animation: spin 1.6s linear infinite;
      transform-origin: center;
      transform-box: fill-box;
    }

    .crank-arm {
      animation: pedal 1.6s linear infinite;
      transform-origin: center;
      transform-box: fill-box;
    }

    .leg {
      /* Таз лягушки (абсолютные координаты в viewBox) */
      transform-origin: 285px 170px;
      animation: leg-move 1.6s linear infinite;
    }
    .leg:nth-child(2) { animation-delay: -0.8s; } /* Вторая нога в противофазе */

    .frog-body {
      animation: bounce 0.4s ease-in-out infinite;
      transform-origin: center;
      transform-box: fill-box;
    }

    .eye {
      transform-origin: center;
      transform-box: fill-box;
      animation: blink 4s infinite;
    }
  </style>
</head>
<body>

<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиенты и паттерны -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4FC3F7"/>
      <stop offset="100%" stop-color="#E1F5FE"/>
    </linearGradient>

    <pattern id="grass" width="100" height="60" patternUnits="userSpaceOnUse">
      <rect width="100" height="60" fill="#7CB342"/>
      <path d="M0 60 Q30 40 50 60 T100 60" fill="#558B2F"/>
    </pattern>

    <radialGradient id="frog-grad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#CDDC39"/> <!-- Светло-жёлтый -->
      <stop offset="100%" stop-color="#4CAF50"/> <!-- Зелёный -->
    </radialGradient>
  </defs>

  <!-- ФОН (смещается назад) -->
  <g class="bg-layer">
    <rect width="1600" height="500" fill="url(#sky)"/>
    <rect y="410" width="1600" height="90" fill="url(#grass)"/>

    <!-- Облака -->
    <g fill="#FFF" opacity="0.85">
      <circle cx="200" cy="120" r="35"/>
      <circle cx="240" cy="100" r="45"/>
      <circle cx="280" cy="120" r="35"/>
      <circle cx="900" cy="150" r="30"/>
      <circle cx="930" cy="130" r="40"/>
      <circle cx="960" cy="150" r="30"/>
    </g>

    <!-- Деревья -->
    <g stroke="#558B2F" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M150 410 L150 350 M150 350 Q120 330 140 310 M150 350 Q170 320 160 300"/>
      <path d="M650 410 L650 360 M650 360 Q620 340 640 320 M650 360 Q670 330 660 310"/>
    </g>
  </g>

  <!-- СЦЕНА (Велосипед + Лягушка) -->
  <g transform="translate(40, 30)">

    <!-- Заднее маленькое колесо -->
    <g transform="translate(230, 380)">
      <circle r="30" fill="none" stroke="#333" stroke-width="4"/>
      <circle r="28" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="3 5"/>
      <g class="wheel" stroke="#888" stroke-width="2">
        <line x1="0" y1="-28" x2="0" y2="28"/>
        <line x1="-28" y1="0" x2="28" y2="0"/>
        <line x1="-20" y1="-20" x2="20" y2="20"/>
        <line x1="-20" y1="20" x2="20" y2="-20"/>
      </g>
    </g>

    <!-- Переднее большое колесо (пенни-фартинг) -->
    <g transform="translate(400, 310)">
      <circle r="85" fill="none" stroke="#222" stroke-width="5"/>
      <circle r="81" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="1 6"/>

      <!-- Радиальные спицы -->
      <g class="wheel" stroke="#777" stroke-width="2">
        <line x1="0" y1="-81" x2="0" y2="81"/>
        <line x1="-81" y1="0" x2="81" y2="0"/>
        <line x1="-57" y1="-57" x2="57" y2="57"/>
        <line x1="-57" y1="57" x2="57" y2="-57"/>
        <line x1="0" y1="-81" x2="0" y2="81" transform="rotate(45)"/>
        <line x1="0" y1="-81" x2="0" y2="81" transform="rotate(-45)"/>
        <line x1="0" y1="-81" x2="0" y2="81" transform="rotate(22.5)"/>
        <line x1="0" y1="-81" x2="0" y2="81" transform="rotate(-22.5)"/>
      </g>

      <!-- Каретка с педалью (крутится вместе с передним колесом) -->
      <g class="crank-arm">
        <line x1="0" y1="0" x2="38" y2="0" stroke="#444" stroke-width="6" stroke-linecap="round"/>
        <rect x="33" y="-7" width="12" height="14" fill="#333" rx="2"/>
      </g>
    </g>

    <!-- Рама велосипеда -->
    <g stroke="#333" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="400" y1="310" x2="330" y2="170"/> <!-- Вилка к рулю -->
      <path d="M320 170 Q300 150 280 140"/> <!-- Руль -->
      <line x1="400" y1="310" x2="280" y2="160"/> <!-- Рама к седлу -->
      <ellipse cx="280" cy="160" rx="30" ry="10" fill="#444"/> <!-- Седло -->
    </g>

    <!-- ЛЯГУШКА -->
    <g class="frog-body">
      <!-- Ноги (крутят педали) -->
      <g class="leg">
        <path d="M0 -120 Q 35 -75 38 -10" fill="none" stroke="#2E7D32" stroke-width="12" stroke-linecap="round"/>
        <ellipse cx="38" cy="-10" rx="10" ry="5" fill="#1B5E20" transform="rotate(-15 38 -10)"/>
      </g>
      <g class="leg">
        <path d="M0 -120 Q -25 -85 -30 -20" fill="none" stroke="#2E7D32" stroke-width="12" stroke-linecap="round"/>
        <ellipse cx="-30" cy="-20" rx="10" ry="5" fill="#1B5E20" transform="rotate(15 -30 -20)"/>
      </g>

      <!-- Тело -->
      <ellipse cx="30" cy="20" rx="52" ry="45" fill="url(#frog-grad)"/>
      <ellipse cx="30" cy="32" rx="34" ry="24" fill="#E6EE9C"/>

      <!-- Руки на руле -->
      <path d="M65 5 Q 95 -5 130 0" fill="none" stroke="#2E7D32" stroke-width="10" stroke-linecap="round"/>
      <path d="M60 20 Q 90 10 130 10" fill="none" stroke="#2E7D32" stroke-width="10" stroke-linecap="round"/>
      <circle cx="130" cy="5" r="6" fill="#1B5E20"/>

      <!-- Голова с глазами -->
      <g transform="translate(15, -35)">
        <!-- Левый глаз -->
        <g transform="translate(-24, -8)">
          <ellipse class="eye" cx="0" cy="0" rx="14" ry="18" fill="#FFF"/>
          <circle cx="0" cy="-4" r="7.5" fill="#000"/>
          <circle cx="-3" cy="-6" r="2.5" fill="#FFF"/>
        </g>
        <!-- Правый глаз -->
        <g transform="translate(24, -8)">
          <ellipse class="eye" cx="0" cy="0" rx="14" ry="18" fill="#FFF"/>
          <circle cx="0" cy="-4" r="7.5" fill="#000"/>
          <circle cx="-3" cy="-6" r="2.5" fill="#FFF"/>
        </g>
        <!-- Рот -->
        <path d="M -24 14 Q 0 24 24 14" fill="none" stroke="#C62828" stroke-width="3.5" stroke-linecap="round"/>
        <!-- Румянец -->
        <ellipse cx="-34" cy="10" rx="10" ry="5.5" fill="#FF8A80" opacity="0.7"/>
        <ellipse cx="34" cy="10" rx="10" ry="5.5" fill="#FF8A80" opacity="0.7"/>
      </g>
    </g>
  </g>
</svg>

</body>
</html>
