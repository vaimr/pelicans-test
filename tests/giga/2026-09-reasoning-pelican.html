<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пеликан на велосипеде 🚴‍♂️</title>
    <style>
        :root {
            --sky-top: #1a3b6c;
            --sky-bottom: #87ceeb;
            --road: #6b7b6f;
            --road-darker: #5a6a5e;
            --grass: #4c8c4a;
            --grass-light: #6daf6a;
            --cloud: #f8fafc;
            --cloud-shadow: #e2e8f0;
            --sun: #ffd54f;
            --sun-glow: #ffb300;
            --bike-frame: #e53935;
            --bike-accent: #ffb74d;
            --tire: #2d2d2d;
            --spoke: #cfd8dc;
            --hub: #bdbdbd;
            --pedal: #7c4dff;
            --pelican-body: #fff9e6;
            --pelican-head: #fff5d7;
            --pelican-zob: #ffb6c1;
            --pelican-beak: #ff8a65;
            --pelican-wing: #90caf9;
            --pelican-wing-dark: #577590;
            --pelican-leg: #ffcc80;
            --pelican-foot: #ef9a9a;
            --eye: #1e2b3c;
            --eye-white: #ffffff;
            --shadow: rgba(0, 0, 0, 0.12);
            --glow: rgba(255, 255, 200, 0.35);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #0f172a 0%, #1e293b 40%, #334155 100%);
            font-family: 'Segoe UI', 'Noto Sans', system-ui, sans-serif;
            padding: 1rem;
        }

        .container {
            background: var(--shadow);
            border-radius: 2.5rem;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35), 0 0 0 2px rgba(255, 255, 255, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
            max-width: 900px;
            width: 100%;
            aspect-ratio: 800 / 400;
        }

        svg {
            display: block;
            width: 100%;
            height: 100%;
            background: transparent;
        }

        /* подпись */
        .caption {
            margin-top: 0.75rem;
            color: #cbd5e1;
            font-size: 0.95rem;
            letter-spacing: 0.03em;
            text-align: center;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            gap: 0.4rem;
            justify-content: center;
        }
        .caption span {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }
        .caption .emoji {
            font-size: 1.3rem;
        }

        /* ==================== ANIMATIONS ==================== */

        /* Вращение заднего колеса */
        @keyframes wheel-rear {
            from {
                transform: translate(300px, 220px) rotate(0deg);
            }
            to {
                transform: translate(300px, 220px) rotate(360deg);
            }
        }

        /* Вращение переднего колеса */
        @keyframes wheel-front {
            from {
                transform: translate(550px, 220px) rotate(0deg);
            }
            to {
                transform: translate(550px, 220px) rotate(360deg);
            }
        }

        /* Вращение группы спиц заднего колеса */
        @keyframes spokes-rear {
            from {
                transform: translate(300px, 220px) rotate(0deg);
            }
            to {
                transform: translate(300px, 220px) rotate(360deg);
            }
        }

        /* Вращение группы спиц переднего колеса */
        @keyframes spokes-front {
            from {
                transform: translate(550px, 220px) rotate(0deg);
            }
            to {
                transform: translate(550px, 220px) rotate(360deg);
            }
        }

        /* Вращение кривошипа + педалей */
        @keyframes crank-rotate {
            from {
                transform: translate(400px, 250px) rotate(0deg);
            }
            to {
                transform: translate(400px, 250px) rotate(360deg);
            }
        }

        /* Вращение самих педалей (дополнительный угол для эффекта) */
        @keyframes pedal-spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        /* Покачивание пеликана (имитация кручения педалей) */
        @keyframes pelican-bob {
            0%,
            100% {
                transform: translateY(0px) rotate(-0.8deg);
            }
            25% {
                transform: translateY(-5px) rotate(0.4deg);
            }
            50% {
                transform: translateY(2px) rotate(-1.6deg);
            }
            75% {
                transform: translateY(-3px) rotate(0.2deg);
            }
        }

        /* Покачивание головы */
        @keyframes head-bob {
            0%,
            100% {
                transform: rotate(0deg);
            }
            50% {
                transform: rotate(1.2deg);
            }
        }

        /* Движение зоба (развевается) */
        @keyframes zob-sway {
            0%,
            100% {
                transform: translateX(0px) translateY(0px) rotate(-1deg);
            }
            30% {
                transform: translateX(-5px) translateY(3px) rotate(2deg);
            }
            60% {
                transform: translateX(4px) translateY(-2px) rotate(-2deg);
            }
            85% {
                transform: translateX(-3px) translateY(1px) rotate(1.5deg);
            }
        }

        /* Движение крыла (для баланса) */
        @keyframes wing-flap {
            0%,
            100% {
                transform: rotate(-4deg);
            }
            50% {
                transform: rotate(6deg);
            }
        }

        /* Движение дальнего фона (медленный параллакс) */
        @keyframes bg-far {
            from {
                transform: translateX(0px);
            }
            to {
                transform: translateX(-180px);
            }
        }

        /* Движение среднего фона */
        @keyframes bg-mid {
            from {
                transform: translateX(0px);
            }
            to {
                transform: translateX(-280px);
            }
        }

        /* Движение переднего фона (дорога/трава) */
        @keyframes bg-front {
            from {
                transform: translateX(0px);
            }
            to {
                transform: translateX(-400px);
            }
        }

        /* Движение облаков (разные слои) */
        @keyframes cloud-slow {
            from {
                transform: translateX(0px);
            }
            to {
                transform: translateX(-200px);
            }
        }

        @keyframes cloud-medium {
            from {
                transform: translateX(0px);
            }
            to {
                transform: translateX(-320px);
            }
        }

        @keyframes cloud-fast {
            from {
                transform: translateX(0px);
            }
            to {
                transform: translateX(-500px);
            }
        }

        /* Движение травы на обочине */
        @keyframes grass-sway {
            0%,
            100% {
                transform: rotate(0deg);
            }
            50% {
                transform: rotate(-1.4deg);
            }
        }

        /* Пульсация солнца */
        @keyframes sun-pulse {
            0%,
            100% {
                filter: drop-shadow(0 0 6px #ffb300);
                transform: scale(1);
            }
            50% {
                filter: drop-shadow(0 0 18px #ffb300) drop-shadow(0 0 30px rgba(255, 180, 0, 0.5));
                transform: scale(1.08);
            }
        }

        /* Мерцание бликов на металле */
        @keyframes shine {
            0%,
            100% {
                opacity: 0.4;
            }
            30% {
                opacity: 0.9;
            }
            60% {
                opacity: 0.3;
            }
        }

        /* Анимация пунктирной разметки дороги */
        @keyframes road-dash {
            from {
                stroke-dashoffset: 0;
            }
            to {
                stroke-dashoffset: -40;
            }
        }

        /* ==================== BASE STYLES ==================== */

        /* Дорога */
        .road-bg {
            fill: var(--road);
        }
        .road-stripe {
            fill: none;
            stroke: var(--road-darker);
            stroke-width: 12;
            stroke-dasharray: 18 14;
            stroke-linecap: round;
            animation: road-dash 0.8s linear infinite;
        }
        .road-edge {
            fill: none;
            stroke: #d1d5db;
            stroke-width: 4;
            stroke-dasharray: 6 8;
        }

        /* Трава */
        .grass {
            fill: var(--grass);
        }
        .grass-light {
            fill: var(--grass-light);
        }
        .grass-blade {
            fill: #3a7d34;
        }

        /* Облака */
        .cloud {
            fill: var(--cloud);
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.1));
        }
        .cloud-soft {
            fill: #f1f5f9;
        }

        /* Солнце */
        .sun {
            fill: var(--sun);
            filter: drop-shadow(0 0 10px var(--sun-glow));
            animation: sun-pulse 4s ease-in-out infinite;
        }
        .sun-core {
            fill: #ffeb3b;
        }
        .sun-ray {
            fill: #ffd54f;
            animation: shine 2.5s ease-in-out infinite;
        }

        /* Велосипед */
        .bike-frame {
            fill: var(--bike-frame);
            filter: drop-shadow(0 4px 8px rgba(230, 0, 0, 0.3));
        }
        .bike-frame-shine {
            fill: none;
            stroke: rgba(255, 255, 255, 0.25);
            stroke-width: 2;
        }
        .tire {
            fill: var(--tire);
        }
        .tire-tread {
            fill: #1e2b3c;
        }
        .spoke-line {
            stroke: var(--spoke);
            stroke-width: 2.5;
            stroke-linecap: round;
        }
        .hub {
            fill: var(--hub);
        }
        .hub-cap {
            fill: #d1d5db;
        }
        .pedal-body {
            fill: var(--pedal);
            filter: drop-shadow(0 3px 6px rgba(124, 77, 255, 0.4));
        }
        .pedal-reflect {
            fill: none;
            stroke: rgba(255, 255, 255, 0.35);
            stroke-width: 2;
        }
        .crank-arm {
            fill: #cfd8dc;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.25));
        }
        .crank-cap {
            fill: #bdbdbd;
        }
        .chain {
            fill: #4b5563;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
        }
        .chainring {
            fill: #e5e7eb;
            filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.5));
        }
        .chainring-dots {
            fill: #9ca3af;
        }

        /* Пеликан */
        .pelican-body {
            fill: var(--pelican-body);
            filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.15));
        }
        .pelican-body-light {
            fill: #fffaf2;
        }
        .pelican-head {
            fill: var(--pelican-head);
        }
        .pelican-head-light {
            fill: #fff7e6;
        }
        .pelican-zob {
            fill: var(--pelican-zob);
            filter: drop-shadow(0 4px 10px rgba(255, 100, 150, 0.35));
        }
        .pelican-zob-shine {
            fill: none;
            stroke: rgba(255, 255, 255, 0.3);
            stroke-width: 1.5;
        }
        .pelican-beak {
            fill: var(--pelican-beak);
            filter: drop-shadow(0 3px 8px rgba(255, 100, 80, 0.4));
        }
        .pelican-beak-tip {
            fill: #ff6b4a;
        }
        .pelican-eye {
            fill: var(--eye);
        }
        .pelican-eye-white {
            fill: var(--eye-white);
        }
        .pelican-eye-glow {
            fill: #ffecb3;
        }
        .pelican-wing {
            fill: var(--pelican-wing);
            filter: drop-shadow(0 4px 10px rgba(0, 80, 170, 0.25));
        }
        .pelican-wing-dark {
            fill: var(--pelican-wing-dark);
        }
        .pelican-wing-curve {
            fill: none;
            stroke: #577590;
            stroke-width: 3;
            stroke-linecap: round;
        }
        .pelican-leg {
            fill: var(--pelican-leg);
            filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.15));
        }
        .pelican-leg-dark {
            fill: #e57373;
        }
        .pelican-foot {
            fill: var(--pelican-foot);
        }
        .pelican-foot-line {
            fill: none;
            stroke: #b71c1c;
            stroke-width: 2.5;
            stroke-linecap: round;
        }
        .pelican-tail {
            fill: #ffcc80;
        }
        .pelican-tail-dark {
            fill: #ef9a9a;
        }

        /* Тень */
        .shadow {
            fill: rgba(0, 0, 0, 0.18);
            filter: blur(6px);
            opacity: 0.7;
        }

        /* Блик */
        .glow-dot {
            fill: var(--glow);
            filter: blur(5px);
            opacity: 0.5;
        }

        /* ==================== ANIMATION ASSIGNMENTS ==================== */

        .wheel-rear-group {
            animation: wheel-rear 1.4s linear infinite;
            transform-origin: 300px 220px;
            transform-box: fill-box;
        }
        .spokes-rear-group {
            animation: spokes-rear 1.4s linear infinite;
            transform-origin: 300px 220px;
            transform-box: fill-box;
        }
        .wheel-front-group {
            animation: wheel-front 1.4s linear infinite;
            transform-origin: 550px 220px;
            transform-box: fill-box;
        }
        .spokes-front-group {
            animation: spokes-front 1.4s linear infinite;
            transform-origin: 550px 220px;
            transform-box: fill-box;
        }
        .crank-group {
            animation: crank-rotate 1.4s linear infinite;
            transform-origin: 400px 250px;
            transform-box: fill-box;
        }
        .pedal-left {
            animation: pedal-spin 1.4s linear infinite;
            transform-origin: 370px 250px;
            transform-box: fill-box;
        }
        .pedal-right {
            animation: pedal-spin 1.4s linear infinite;
            transform-origin: 430px 250px;
            transform-box: fill-box;
        }
        .pelican-group {
            animation: pelican-bob 1.4s ease-in-out infinite;
            transform-origin: 400px 230px;
            transform-box: fill-box;
        }
        .pelican-head-group {
            animation: head-bob 1.4s ease-in-out infinite;
            transform-origin: 440px 165px;
            transform-box: fill-box;
        }
        .pelican-zob-group {
            animation: zob-sway 1.4s ease-in-out infinite;
            transform-origin: 455px 185px;
            transform-box: fill-box;
        }
        .pelican-wing-left {
            animation: wing-flap 1.4s ease-in-out infinite;
            transform-origin: 380px 190px;
            transform-box: fill-box;
        }
        .pelican-wing-right {
            animation: wing-flap 1.4s ease-in-out infinite;
            transform-origin: 460px 190px;
            transform-box: fill-box;
        }
        .bg-far-layer {
            animation: bg-far 20s linear infinite;
            transform-origin: 400px 200px;
            transform-box: fill-box;
        }
        .bg-mid-layer {
            animation: bg-mid 16s linear infinite;
            transform-origin: 400px 200px;
            transform-box: fill-box;
        }
        .bg-front-layer {
            animation: bg-front 12s linear infinite;
            transform-origin: 400px 200px;
            transform-box: fill-box;
        }
        .cloud-slow-1 {
            animation: cloud-slow 30s linear infinite;
            transform-origin: 400px 100px;
            transform-box: fill-box;
        }
        .cloud-slow-2 {
            animation: cloud-slow 35s linear infinite;
            transform-origin: 400px 100px;
            transform-box: fill-box;
        }
        .cloud-medium-1 {
            animation: cloud-medium 22s linear infinite;
            transform-origin: 400px 140px;
            transform-box: fill-box;
        }
        .cloud-medium-2 {
            animation: cloud-medium 26s linear infinite;
            transform-origin: 400px 140px;
            transform-box: fill-box;
        }
        .cloud-fast-1 {
            animation: cloud-fast 14s linear infinite;
            transform-origin: 400px 80px;
            transform-box: fill-box;
        }
        .cloud-fast-2 {
            animation: cloud-fast 18s linear infinite;
            transform-origin: 400px 80px;
            transform-box: fill-box;
        }
        .grass-blade-group {
            animation: grass-sway 2s ease-in-out infinite;
            transform-origin: 400px 310px;
            transform-box: fill-box;
        }
    </style>
</head>
<body>
    <div class="container">
        <svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" aria-label="Мультяшный пеликан едет на велосипеде">

            <!-- ==================== DEFS ==================== -->
            <defs>
                <!-- Градиент неба -->
                <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="var(--sky-top)" />
                    <stop offset="55%" stop-color="#3a6ea5" />
                    <stop offset="100%" stop-color="var(--sky-bottom)" />
                </linearGradient>

                <!-- Градиент солнца -->
                <radialGradient id="sunGrad" cx="30%" cy="30%" r="70%">
                    <stop offset="0%" stop-color="#ffeb3b" />
                    <stop offset="40%" stop-color="#ffd54f" />
                    <stop offset="70%" stop-color="#ffb300" />
                    <stop offset="100%" stop-color="#ff8f00" />
                </radialGradient>

                <!-- Градиент зоба -->
                <linearGradient id="zobGrad" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#ff9eaa" />
                    <stop offset="50%" stop-color="#ff80ab" />
                    <stop offset="100%" stop-color="#d81b60" />
                </linearGradient>

                <!-- Градиент клюва -->
                <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#ffb74d" />
                    <stop offset="60%" stop-color="#ff8a65" />
                    <stop offset="100%" stop-color="#d32f2f" />
                </linearGradient>

                <!-- Градиент колеса -->
                <linearGradient id="tireGrad" x1="0" y1="-0.5" x2="0" y2="0.5">
                    <stop offset="0%" stop-color="#1e2b3c" />
                    <stop offset="60%" stop-color="#2d3849" />
                    <stop offset="100%" stop-color="#0f1a26" />
                </linearGradient>

                <!-- Градиент рамы -->
                <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#e53935" />
                    <stop offset="50%" stop-color="#c62828" />
                    <stop offset="100%" stop="#b71c1c" />
                </linearGradient>

                <!-- Градиент педали -->
                <linearGradient id="pedalGrad" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#9c27b0" />
                    <stop offset="50%" stop-color="#7c4dff" />
                    <stop offset="100%" stop-color="#536dfe" />
                </linearGradient>

                <!-- Градиент пеликана -->
                <linearGradient id="pelicanBodyGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#fff9e6" />
                    <stop offset="60%" stop-color="#ffe0b2" />
                    <stop offset="100%" stop-color="#ffcc80" />
                </linearGradient>

                <!-- Фильтр тени -->
                <filter id="blurShadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="rgba(0,0,0,0.25)" flood-opacity="0.5" />
                </filter>

                <!-- Фильтр свечения -->
                <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
                    <feGaussianBlur stdDeviation="6" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>

                <!-- Фильтр для облаков -->
                <filter id="cloudFilter" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="3" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
            </defs>

            <!-- ==================== BACKGROUND (FAR) ==================== -->
            <!-- Небо -->
            <rect x="0" y="0" width="800" height="300" fill="url(#skyGrad)" />

            <!-- Далёкие облака (медленные) -->
            <!-- Слой 1 (самый дальний) -->
            <g class="cloud-slow-1" opacity="0.7">
                <circle cx="120" cy="75" r="45" fill="#f1f5f9" class="cloud-soft" />
                <circle cx="170" cy="65" r="38" fill="#e2e8f0" class="cloud-soft" />
                <circle cx="145" cy="88" r="32" fill="#cbd5e1" class="cloud-soft" />
            </g>
            <g class="cloud-slow-2" opacity="0.65">
                <circle cx="620" cy="95" r="50" fill="#f1f5f9" class="cloud-soft" />
                <circle cx="675" cy="85" r="40" fill="#e2e8f0" class="cloud-soft" />
                <circle cx="645" cy="105" r="30" fill="#cbd5e1" class="cloud-soft" />
            </g>

            <!-- Средние облака -->
            <g class="cloud-medium-1" opacity="0.85">
                <circle cx="250" cy="130" r="55" fill="#f8fafc" class="cloud" />
                <circle cx="300" cy="120" r="45" fill="#f1f5f9" class="cloud" />
                <circle cx="275" cy="145" r="38" fill="#e2e8f0" class="cloud" />
                <circle cx="230" cy="125" r="28" fill="#cbd5e1" class="cloud" />
            </g>
            <g class="cloud-medium-2" opacity="0.8">
                <circle cx="520" cy="155" r="60" fill="#f8fafc" class="cloud" />
                <circle cx="575" cy="145" r="48" fill="#f1f5f9" class="cloud" />
                <circle cx="545" cy="165" r="40" fill="#e2e8f0" class="cloud" />
                <circle cx="500" cy="150" r="30" fill="#cbd5e1" class="cloud" />
            </g>

            <!-- Быстрые облака (передний план неба) -->
            <g class="cloud-fast-1" opacity="0.95">
                <circle cx="180" cy="195" r="40" fill="#f8fafc" class="cloud" />
                <circle cx="220" cy="188" r="32" fill="#f1f5f9" class="cloud" />
                <circle cx="195" cy="205" r="25" fill="#e2e8f0" class="cloud" />
            </g>
            <g class="cloud-fast-2" opacity="0.9">
                <circle cx="650" cy="210" r="45" fill="#f8fafc" class="cloud" />
                <circle cx="695" cy="202" r="35" fill="#f1f5f9" class="cloud" />
                <circle cx="670" cy="220" r="28" fill="#e2e8f0" class="cloud" />
            </g>

            <!-- Солнце -->
            <g class="sun" filter="url(#glow)">
                <circle cx="680" cy="100" r="50" fill="url(#sunGrad)" class="sun-core" />
                <!-- Лучи -->
                <g class="sun-ray" opacity="0.8">
                    <rect x="655" y="88" width="50" height="6" rx="3" transform="rotate(45 680 100)" />

            <!-- ==================== WIND LINES (motion effect) ==================== -->
