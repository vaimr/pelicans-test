<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лягушка на Пенни-Фартинге</title>
    <style>
        :root {
            --sky-top: #87CEEB;
            --sky-bottom: #E0F7FA;
            --sun-color: #FFD700;
            --cloud-color: #FFFFFF;
            --hill-color: #8BC34A;
            --grass-color: #66BB6A;
            --tree-color: #388E3C;
            --frog-green: #4CAF50;
            --frog-yellow: #FFEB3B;
            --frog-belly: #FFF9C4;
            --bike-metal: #BDBDBD;
            --bike-dark: #616161;
            --bike-tires: #212121;
            --pedal-color: #FFC107;
            --saddle-color: #795548;
            --eye-white: #FFFFFF;
            --eye-black: #212121;
            --eye-shine: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial', sans-serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 1200px;
            height: 600px;
        }

        h1 {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2.5em;
            color: #FFEB3B;
            text-shadow: 0 0 20px rgba(255, 235, 59, 0.8);
            z-index: 10;
            letter-spacing: 3px;
            animation: titleGlow 3s ease-in-out infinite alternate;
        }

        @keyframes titleGlow {
            0% {
                text-shadow: 0 0 15px rgba(255, 235, 59, 0.6);
            }
            100% {
                text-shadow: 0 0 30px rgba(255, 235, 59, 1), 0 0 60px rgba(255, 215, 0, 0.4);
            }
        }

        .subtitle {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1em;
            color: #FFFFFF;
            opacity: 0.8;
            z-index: 10;
            letter-spacing: 2px;
        }

        svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Background Animations */
        .bg-sky {
            animation: skyMove 40s linear infinite;
        }

        .bg-sun {
            animation: sunGlow 4s ease-in-out infinite alternate;
        }

        .bg-cloud-far {
            animation: cloudMoveFar 60s linear infinite;
        }

        .bg-cloud-near {
            animation: cloudMoveNear 30s linear infinite;
        }

        .bg-hills {
            animation: hillsMove 50s linear infinite;
        }

        .bg-grass {
            animation: grassMove 45s linear infinite;
        }

        .bg-trees {
            animation: treesMove 35s linear infinite;
        }

        @keyframes skyMove {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-50%);
            }
        }

        @keyframes sunGlow {
            0% {
                filter: brightness(1);
            }
            100% {
                filter: brightness(1.5);
            }
        }

        @keyframes cloudMoveFar {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-100%);
            }
        }

        @keyframes cloudMoveNear {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-100%);
            }
        }

        @keyframes hillsMove {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-30%);
            }
        }

        @keyframes grassMove {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-40%);
            }
        }

        @keyframes treesMove {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-50%);
            }
        }

        /* Bike Animations */
        .wheel-front {
            animation: wheelRotate 8s linear infinite;
            transform-origin: 280px 480px;
        }

        .wheel-rear {
            animation: wheelRotate 8s linear infinite;
            transform-origin: 420px 480px;
        }

        .pedal-left {
            animation: pedalRotate 1.8s ease-in-out infinite;
            transform-origin: 320px 460px;
        }

        .pedal-right {
            animation: pedalRotate 1.8s ease-in-out infinite;
            transform-origin: 320px 460px;
            animation-delay: -0.9s;
        }

        .chain {
            animation: chainMove 1.8s ease-in-out infinite;
        }

        @keyframes wheelRotate {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes pedalRotate {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes chainMove {
            0% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-8px);
            }
            100% {
                transform: translateY(0);
            }
        }

        /* Frog Animations */
        .frog-body {
            animation: bodyBounce 0.8s ease-in-out infinite alternate;
            transform-origin: 320px 380px;
        }

        .frog-leg-left {
            animation: legMove 1.5s ease-in-out infinite alternate;
            transform-origin: 300px 400px;
        }

        .frog-leg-right {
            animation: legMove 1.5s ease-in-out infinite alternate;
            transform-origin: 340px 400px;
            animation-delay: -0.75s;
        }

        .frog-arm-left {
            animation: armMove 1.2s ease-in-out infinite alternate;
            transform-origin: 280px 360px;
        }

        .frog-arm-right {
            animation: armMove 1.2s ease-in-out infinite alternate;
            transform-origin: 360px 360px;
            animation-delay: -0.6s;
        }

        .frog-eye-left {
            animation: eyeBlink 4s ease-in-out infinite;
        }

        .frog-eye-right {
            animation: eyeBlink 4s ease-in-out infinite;
            animation-delay: -2s;
        }

        @keyframes bodyBounce {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(-6px);
            }
        }

        @keyframes legMove {
            0% {
                transform: rotate(10deg);
            }
            100% {
                transform: rotate(-30deg);
            }
        }

        @keyframes armMove {
            0% {
                transform: rotate(-5deg);
            }
            100% {
                transform: rotate(15deg);
            }
        }

        @keyframes eyeBlink {
            0%,
            100% {
                transform: scaleY(1);
            }
            30% {
                transform: scaleY(0.3);
            }
            60% {
                transform: scaleY(1);
            }
        }

        /* Glow Effects */
        .glow {
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.6));
        }

        .glow-strong {
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.9));
        }

        .shine {
            filter: drop-shadow(0 0 5px rgba(255, 255, 200, 0.8));
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐸 ЛЯГУШКА-ГОНЩИК 🐸</h1>
        <div class="subtitle">На пенни-фартинге с ветерком!</div>

        <svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
            <!-- DEFS FOR GRADIENTS AND FILTERS -->
            <defs>
                <!-- Sky Gradient -->
                <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="var(--sky-top)" />
                    <stop offset="100%" stop-color="var(--sky-bottom)" />
                </linearGradient>

                <!-- Sun Gradient -->
                <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#FFD700" />
                    <stop offset="40%" stop-color="#FFEC8B" />
                    <stop offset="100%" stop-color="#FFC107" />
                </radialGradient>

                <!-- Cloud Filter -->
                <filter id="cloudFilter" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="3" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>

                <!-- Glow Filter -->
                <filter id="glowFilter" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="5" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>

                <!-- Metal Shine -->
                <filter id="metalShine" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="2" result="blur" />
                    <feSpecularLighting surfaceScale="5" specularConstant="1" specularExponent="20" lighting-color="white">
                        <feDistantLight azimuth="45" elevation="55" />
                    </feSpecularLighting>
                    <feComposite in="SourceGraphic" in2="specLight" operator="in" />
                </filter>

                <!-- Frog Skin Gradient -->
                <linearGradient id="frogSkin" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#4CAF50" />
                    <stop offset="50%" stop-color="#66BB6A" />
                    <stop offset="100%" stop-color="#81C784" />
                </linearGradient>

                <!-- Frog Belly Gradient -->
                <linearGradient id="frogBelly" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#FFF9C4" />
                    <stop offset="100%" stop-color="#FFE082" />
                </linearGradient>

                <!-- Tire Gradient -->
                <linearGradient id="tireGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#424242" />
                    <stop offset="50%" stop-color="#212121" />
                    <stop offset="100%" stop-color="#0D0D0D" />
                </linearGradient>

                <!-- Rim Gradient -->
                <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#E0E0E0" />
                    <stop offset="50%" stop-color="#BDBDBD" />
                    <stop offset="100%" stop-color="#9E9E9E" />
                </linearGradient>

                <!-- Pedal Gradient -->
                <linearGradient id="pedalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#FFC107" />
                    <stop offset="50%" stop-color="#FFD54F" />
                    <stop offset="100%" stop-color="#FFB300" />
                </linearGradient>

                <!-- Saddle Gradient -->
                <linearGradient id="saddleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#8D6E63" />
                    <stop offset="50%" stop-color="#6D4C41" />
                    <stop offset="100%" stop-color="#5D4037" />
                </linearGradient>

                <!-- Eye Shine -->
                <radialGradient id="eyeShine" cx="30%" cy="30%" r="50%">
                    <stop offset="0%" stop-color="#FFFFFF" />
                    <stop offset="100%" stop-color="rgba(255,255,255,0)" />
                </radialGradient>
            </defs>

            <!-- BACKGROUND LAYERS -->

            <!-- Sky -->
            <rect x="0" y="0" width="1200" height="600" fill="url(#skyGrad)" class="bg-sky" />

            <!-- Sun -->
            <circle cx="1050" cy="100" r="60" fill="url(#sunGrad)" class="bg-sun glow" />
            <!-- Sun rays -->
            <g fill="var(--sun-color)" opacity="0.7">
                <rect x="1030" y="80" width="40" width="40" transform="rotate(-45 1030 80)" height="5" />
                <rect x="1060" y="70" width="40" width="40" transform="rotate(45 1060 70)" height="5" />
                <rect x="1005" y="110" width="50" width="40" transform="rotate(135 1005 110)" height="5" />
                <rect x="1075" y="120" width="50" width="40" transform="rotate(-135 1075 120)" height="5" />
                <rect x="990" y="95" width="40" width="40" transform="rotate(-90 990 95)" height="5" />
                <rect x="1090" y="105" width="40" width="40" transform="rotate(90 1090 105)" height="5" />
            </g>

            <!-- Far Clouds (slower) -->
            <g class="bg-cloud-far" opacity="0.7">
                <circle cx="200" cy="120" r="40" fill="var(--cloud-color)" filter="url(#cloudFilter)" />
                <circle cx="260" cy="100" r="35" fill="var(--cloud-color)" filter="url(#cloudFilter)" />
                <circle cx="300" cy="140" r="30" fill="var(--cloud-color)" filter="url(#cloudFilter)" />
                <circle cx="800" cy="150" r="45" fill="var(--cloud-color)" filter="url(#cloudFilter)" />
                <circle cx="860" cy="130" r="35" fill="var(--cloud-color)" filter="url(#cloudFilter)" />
                <circle cx="1000" cy="110" r="30" fill="var(--cloud-color)" filter="url(#cloudFilter)" />
            </g>

            <!-- Near Clouds (faster) -->
            <g class="bg-cloud-near" opacity="0.8">
                <circle cx="150" cy="200" r="50" fill="var(--cloud-color)" filter="url(#cloudFilter)" />
                <circle cx="220" cy="180" r="40" fill="var(--cloud-color)" filter="url(#cloudFilter)" />
                <circle cx="280" cy="220" r="45" fill="var(--cloud-color)" filter="url(#cloudFilter)" />
                <circle cx="700" cy="230" r="55" fill="var(--cloud-color)" filter="url(#cloudFilter)" />
                <circle cx="780" cy="200" r="40" fill="var(--cloud-color)" filter="url(#cloudFilter)" />
                <circle cx="900" cy="190" r="45" fill="var(--cloud-color)" filter="url(#cloudFilter)" />
            </g>

            <!-- Hills -->
            <g class="bg-hills" fill="var(--hill-color)">
                <path d="M0,400 C150,350 300,380 450,340 C600,300 750,350 900,320 C1050,290 1200,330 1200,330 L1200,600 L0,600 Z" />
                <path d="M0,420 C100,380 250,400 400,360 C550,320 700,370 850,340 C1000,310 1150,350 1200,320 L1200,600 L0,600 Z" opacity="0.8" />
            </g>

            <!-- Grass -->
            <g class="bg-grass" fill="var(--grass-color)">
                <rect x="0" y="500" width="1200" height="100" />
                <path d="M0,500 C100,480 200,510 300,490 C400,470 500,500 600,480 C700,460 800,490 900,470 C1000,450 1100,480 1200,460 L1200,600 L0,600 Z" opacity="0.8" />
            </g>

            <!-- Trees -->
            <g class="bg-trees" fill="var(--tree-color)">
                <!-- Tree 1 -->
                <rect x="100" y="460" width="15" height="80" />
                <circle cx="107" cy="460" r="40" />
                <circle cx="85" cy="470" r="35" />
                <circle cx="125" cy="475" r="30" />
                <circle cx="70" cy="490" r="35" />
                <circle cx="140" cy="490" r="30" />
                <!-- Tree 2 -->
                <rect x="250" y="450" width="15" height="90" />
                <circle cx="257" cy="450" r="45" />
                <circle cx="230" cy="465" r="40" />
                <circle cx="280" cy="460" r="35" />
                <circle cx="215" cy="480" r="35" />
                <circle cx="295" cy="480" r="30" />
                <!-- Tree 3 -->
                <rect x="500" y="470" width="15" height="70" />
                <circle cx="507" cy="470" r="35" />
                <circle cx="485" cy="480" r="30" />
                <circle cx="525" cy="485" r="30" />
                <!-- Tree 4 -->
                <rect x="700" y="455" width="15" height="85" />
                <circle cx="707" cy="455" r="40" />
                <circle cx="685" cy="470" r="35" />
                <circle cx="725" cy="465" r="35" />
                <circle cx="660" cy="480" r="30" />
                <circle cx="750" cy="480" r="30" />
                <!-- Tree 5 -->
                <rect x="950" y="465" width="15" height="75" />
                <circle cx="957" cy="465" r="35" />
                <circle cx="935" cy="475" r="30" />
                <circle cx="975" cy="470" r="30" />
                <!-- Tree 6 -->
                <rect x="1100" y="450" width="15" height="90" />
                <circle cx="1107" cy="450" r="40" />
                <circle cx="1085" cy="465" r="35" />
                <circle cx="1125" cy="460" r="35" />
            </g>

            <!-- Ground -->
            <rect x="0" y="560" width="1200" height="40" fill="#424242" />
            <rect x="0" y="580" width="1200" height="20" fill="#616161" />

            <!-- Road markings -->
            <g stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.5">
                <line x1="0" y1="595" x2="1200" y2="595" />
                <line x1="0" y1="590" x2="1200" y2="590" dasharray="10,20" />
                <line x1="0" y1="585" x2="1200" y2="585" />
            </g>

            <!-- PENNY-FARTING BIKE -->

            <!-- Front Wheel (Large) -->
            <g class="wheel-front glow-strong" id="frontWheel">
                <!-- Tire -->
                <circle cx="280" cy="480" r="90" fill="url(#tireGrad)" stroke="#0D0D0D" stroke-width="8" />
                <!-- Rim -->
                <circle cx="280" cy="480" r="65" fill="url(#rimGrad)" stroke="#616161" stroke-width="3" />
                <!-- Hub -->
                <circle cx="280" cy="480" r="10" fill="var(--bike-metal)" />
                <!-- Radial Spokes (12 spokes) -->
                <g stroke="#BDBDBD" stroke-width="2.5">
                    <!-- Spoke at 0 degrees -->
                    <line x1="280" y1="480" x2="280" y2="390" />
                    <!-- Spokes every 30 degrees -->
                    <line x1="280" y1="480" x2="362.4" y2="437.6" />
                    <line x1="280" y1="480" x2="437.6" y2="462.4" />
                    <line x1="280" y1="480" x2="462.4" y2="522.4" />
                    <line x1="280" y1="480" x2="437.6" y2="582.4" />
                    <line x1="280" y1="480" x2="362.4" y2="607.6" />
                    <line x1="280" y1="480" x2="217.6" y2="607.6" />
                    <line x1="280" y1="480" x2="142.4" y2="582.4" />
                    <line x1="280" y1="480" x2="117.6" y2="522.4" />
                    <line x1="280" y1="480" x2="142.4" y2="462.4" />
                    <line x1="280" y1="480" x2="217.6" y2="437.6" />
                    <line x1="280" y1="480" x2="280" y2="390" />
                </g>
                <!-- Tire valve -->
                <rect x="270" y="470" width="20" height="4" fill="#FF1744" />
            </g>

            <!-- Rear Wheel (Small) -->
            <g class="wheel-rear glow-strong" id="rearWheel">
                <!-- Tire -->
                <circle cx="420" cy="480" r="45" fill="url(#tireGrad)" stroke="#0D0D0D" stroke-width="6" />
                <!-- Rim -->
                <circle cx="420" cy="480" r="30" fill="url(#rimGrad)" stroke="#616161" stroke-width="2" />
                <!-- Hub -->
                <circle cx="420" cy="480" r="8" fill="var(--bike-metal)" />
                <!-- Spokes (8 spokes) -->
                <g stroke="#BDBDBD" stroke-width="2">
                    <line x1="420" y1="480" x2="420" y2="435" />
                    <line x1="420" y1="480" x2="453.0" y2="453.0" />
                    <line x1="420" y1="480" x2="453.0" y2="507.0" />
                    <line x1="420" y1="480" x2="420" y2="525" />
                    <line x1="420" y1="480" x2="387.0" y2="507.0" />
                    <line x1="420" y1="480" x2="387.0" y2="453.0" />
                    <line x1="420" y1="480" x2="420" y2="435" />
                </g>
            </g>

            <!-- Frame -->
            <g stroke="var(--bike-dark)" stroke-width="6" fill="none">
                <!-- Top tube -->
                <path d="M290,380 C320,340 380,330 420,360" />
                <!-- Down tube -->
                <path d="M290,390 C330,420 380,450 420,460" />
                <!-- Seat tube -->
                <path d="M320,380 L320,470" />
                <!-- Head tube -->
                <path d="M260,360 L290,380" />
                <!-- Chain stays -->
                <path d="M420,470 C440,490 460,510 470,540" stroke-width="4" />
                <!-- Seat stays -->
                <path d="M320,380 C340,410 360,440 370,470" stroke-width="4" />
                <path d="M320,380 C300,410 280,440 270,470" stroke-width="4" />
            </g>

            <!-- Handlebars -->
            <g>
                <!-- Handlebar stem -->
                <rect x="250" y="340" width="12" height="50" fill="var(--bike-metal)" rx="3" />
                <!-- Handlebar -->
                <path d="M262,345 C280,330 310,325 320,330" fill="none" stroke="var(--bike-dark)" stroke-width="8" stroke-linecap="round" />
                <!-- Grips -->
                <circle cx="255" cy="345" r="8" fill="var(--saddle-color)" />
                <circle cx="325" cy="332" r="8" fill="var(--saddle-color)" />
                <!-- Bell -->
                <circle cx="265" cy="335" r="6" fill="var(--sun-color)" />
                <circle cx="263" cy="333" r="2" fill="#FFFFFF" />
            </g>

            <!-- Saddle -->
            <g>
                <path d="M310,350 C320,345 340,345 350,350 L340,370 C330,375 315,375 310,370 Z" fill="url(#saddleGrad)" stroke="#5D4037" stroke-width="2" rx="5" />
                <!-- Saddle details -->
                <rect x="315" y="355" width="20" height="8" fill="#8D6E63" rx="2" />
            </g>

            <!-- Pedals -->
            <!-- Left Pedal -->
            <g class="pedal-left shine" id="leftPedal">
                <!-- Pedal arm -->
                <line x1="320" y1="460" x2="280" y2="440" stroke="var(--bike-metal)" stroke-width="6" stroke-linecap="round" />
                <!-- Pedal body -->
                <rect x="265" y="432" width="30" height="16" fill="url(#pedalGrad)" rx="3" />
                <!-- Pedal reflector -->
                <rect x="270" y="436" width="8" height="8" fill="#FF1744" rx="2" />
                <!-- Spindle -->
                <circle cx="280" cy="440" r="4" fill="var(--bike-dark)" />
            </g>

            <!-- Right Pedal -->
            <g class="pedal-right shine" id="rightPedal">
                <!-- Pedal arm -->
                <line x1="320" y1="460" x2="360" y2="480" stroke="var(--bike-metal)" stroke-width="6" stroke-linecap="round" />
                <!-- Pedal body -->
                <rect x="345" y="472" width="30" height="16" fill="url(#pedalGrad)" rx="3" />
                <!-- Pedal reflector -->
                <rect x="350" y="476" width="8" height="8" fill="#FF1744" rx="2" />
                <!-- Spindle -->
                <circle cx="360" cy="480" r="4" fill="var(--bike-dark)" />
            </g>

            <!-- Chain -->
            <g class="chain" fill="var(--bike-dark)">
                <circle cx="320" cy="460" r="4" />
                <circle cx="340" cy="470" r="4" />
                <circle cx="360" cy="478" r="4" />
                <circle cx="380" cy="482" r="4" />
                <circle cx="400" cy="480" r="4" />
                <circle cx="410" cy="475" r="4" />
                <circle cx="415" cy="468" r="4" />
                <circle cx="418" cy="460" r="4" />
                <circle cx="415" cy="452" r="4" />
                <circle cx="400" cy="445" r="4" />
                <circle cx="380" cy="448" r="4" />
                <circle cx="360" cy="450" r="4" />
                <circle cx="340" cy="452" r="4" />
                <circle cx="320" cy="455" r="4" />
            </g>

            <!-- Chainring -->
            <g>
                <circle cx="320" cy="460" r="20" fill="none" stroke="var(--bike-metal)" stroke-width="3" />
                <circle cx="320" cy="460" r="15" fill="none" stroke="var(--bike-metal)" stroke-width="2" />
                <!-- Chainring bolts -->
                <circle cx="328" cy="455" r="3" fill="var(--bike-dark)" />
                <circle cx="335" cy="465" r="3" fill="var(--bike-dark)" />
                <circle cx="328" cy="465" r="3" fill="var(--bike-dark)" />
                <circle cx="315" cy="465" r="3" fill="var(--bike-dark)" />
                <circle cx="312" cy="455" r="3" fill="var(--bike-dark)" />
            </g>

            <!-- FROG -->

            <!-- Frog Body -->
            <g class="frog-body glow" id="frogBody">
                <!-- Body -->
                <ellipse cx="320" cy="380" rx="35" ry="25" fill="url(#frogSkin)" stroke="#388E3C" stroke-width="2" />
                <!-- Belly -->
                <ellipse cx="320" cy="395" rx="25" ry="18" fill="url(#frogBelly)" stroke="#66BB6A" stroke-width="1.5" />
                <!-- Back pattern -->
                <circle cx="305" cy="375" r="6" fill="#388E3C" />
                <circle cx="335" cy="378" r="5" fill="#388E3C" />
                <circle cx="315" cy="385" r="4" fill="#2E7D32" />
                <circle cx="325" cy="390" r="4" fill="#2E7D32" />
            </g>

            <!-- Head -->
            <g>
                <!-- Head -->
                <circle cx="320" cy="340" r="30" fill="url(#frogSkin)" stroke="#388E3C" stroke-width="2" />
                <!-- Cheeks -->
                <circle cx="308" cy="345" r="5" fill="#FF8A80" />
                <circle cx="332" cy="345" r="5" fill="#FF8A80" />
                <!-- Mouth -->
                <path d="M305,355 Q320,365 335,355" fill="none" stroke="#C62828" stroke-width="3" stroke-linecap="round" />
                <!-- Upper lip -->
                <path d="M308,352 Q320,360 332,352" fill="none" stroke="#E57373" stroke-width="2" />

                <!-- Eyes -->
                <!-- Left Eye -->
                <g class="frog-eye-left glow">
                    <!-- Eye white -->
                    <circle cx="300" cy="330" r="10" fill="var(--eye-white)" />
                    <!-- Pupil -->
                    <circle cx="300" cy="330" r="5" fill="var(--eye-black)" />
                    <!-- Eye shine -->
                    <circle cx="296" cy="326" r="2" fill="var(--eye-shine)" />
                    <!-- Eyelid -->
                    <path d="M292,328 Q300,320 308,328" fill="none" stroke="#388E3C" stroke-width="3" />
                </g>

                <!-- Right Eye -->
                <g class="frog-eye-right glow">
                    <!-- Eye white -->
                    <circle cx="340" cy="330" r="10" fill="var(--eye-white)" />
                    <!-- Pupil -->
                    <circle cx="340" cy="330" r="5" fill="var(--eye-black)" />
                    <!-- Eye shine -->
                    <circle cx="344" cy="326" r="2" fill="var(--eye-shine)" />
                    <!-- Eyelid -->
                    <path d="M332,328 Q340,320 348,328" fill="none" stroke="#388E3C" stroke-width="3" />
                </g>

                <!-- Eye brows -->
                <path d="M292,320 Q300,315 308,320" fill="none" stroke="#2E7D32" stroke-width="2.5" />
                <path d="M332,320 Q340,315 348,320" fill="none" stroke="#2E7D32" stroke-width="2.5" />

                <!-- Nostrils -->
                <circle cx="312" cy="342" r="2" fill="#2E7D32" />
                <circle cx="328" cy="342" r="2" fill="#2E7D32" />
            </g>

            <!-- Arms -->
            <!-- Left Arm -->
            <g class="frog-arm-left glow" id="leftArm">
                <!-- Upper arm -->
                <line x1="285" y1="370" x2="260" y2="360" stroke="url(#frogSkin)" stroke-width="10" stroke-linecap="round" />
                <!-- Forearm -->
                <line x1="260" y1="360" x2="245" y2="375" stroke="url(#frogSkin)" stroke-width="9" stroke-linecap="round" />
                <!-- Hand -->
                <circle cx="245" cy="378" r="7" fill="url(#frogSkin)" />
                <!-- Fingers -->
                <rect x="240" y="375" width="8" height="4" fill="#66BB6A" rx="2" />
                <rect x="243" y="380" width="6" height="4" fill="#66BB6A" rx="2" />
                <!-- Hand grip on handlebar -->
                <circle cx="248" cy="375" r="3" fill="var(--bike-dark)" />
            </g>

            <!-- Right Arm -->
            <g class="frog-arm-right glow" id="rightArm">
                <!-- Upper arm -->
                <line x1="355" y1="370" x2="380" y2="360" stroke="url(#frogSkin)" stroke-width="10" stroke-linecap="round" />
                <!-- Forearm -->
                <line x1="380" y1="360" x2="395" y2="375" stroke="url(#frogSkin)" stroke-width="9" stroke-linecap="round" />
                <!-- Hand -->
                <circle cx="395" cy="378" r="7" fill="url(#frogSkin)" />
                <!-- Fingers -->
                <rect x="395" y="375" width="8" height="4" fill="#66BB6A" rx="2" />
                <rect x="398" y="380" width="6" height="4" fill="#66BB6A" rx="2" />
                <!-- Hand grip on handlebar -->
                <circle cx="402" cy="375" r="3" fill="var(--bike-dark)" />
            </g>

            <!-- Legs -->
            <!-- Left Leg -->
            <g class="frog-leg-left glow" id="leftLeg">
                <!-- Thigh -->
                <line x1="300" y1="405" x2="295" y2="440" stroke="url(#frogSkin)" stroke-width="12" stroke-linecap="round" />
                <!-- Shin -->
                <line x1="295" y1="440" x2="298" y2="475" stroke="url(#frogSkin)" stroke-width="10" stroke-linecap="round" />
                <!-- Foot -->
                <path d="M293,475 L308,485 L298,490 L288,480 Z" fill="url(#frogSkin)" stroke="#388E3C" stroke-width="2" />
                <!-- Foot stripes -->
                <rect x="290" y="482" width="6" height="3" fill="#66BB6A" rx="1" />
                <rect x="296" y="486" width="5" height="3" fill="#66BB6A" rx="1" />
                <!-- Toes -->
                <circle cx="305" cy="487" r="3" fill="#81C784" />
                <circle cx="310" cy="485" r="3" fill="#81C784" />
                <circle cx="315" cy="483" r="3" fill="#81C784" />
            </g>

            <!-- Right Leg -->
            <g class="frog-leg-right glow" id="rightLeg">
                <!-- Thigh -->
                <line x1="340" y1="405" x2="345" y2="440" stroke="url(#frogSkin)" stroke-width="12" stroke-linecap="round" />
                <!-- Shin -->
                <line x1="345" y1="440" x2="342" y2="475" stroke="url(#frogSkin)" stroke-width="10" stroke-linecap="round" />
                <!-- Foot -->
                <path d="M347,475 L332,485 L342,490 L352,480 Z" fill="url(#frogSkin)" stroke="#388E3C" stroke-width="2" />
                <!-- Foot stripes -->
                <rect x="340" y="482" width="6" height="3" fill="#66BB6A" rx="1" />
                <rect x="346" y="486" width="5" height="3" fill="#66BB6A" rx="1" />
                <!-- Toes -->
                <circle cx="330" cy="487" r="3" fill="#81C784" />
                <circle cx="325" cy="485" r="3" fill="#81C784" />
                <circle cx="320" cy="483" r="3" fill="#81C784" />
            </g>

            <!-- Pedal feet -->
            <g>
                <!-- Left foot on pedal -->
                <circle cx="280" cy="440" r="5" fill="#FFEB3B" />
                <!-- Right foot on pedal -->
                <circle cx="360" cy="480" r="5" fill="#FFEB3B" />
            </g>

            <!-- Frog details -->
            <g>
                <!-- Spots on back -->
                <circle cx="300" cy="370" r="4" fill="#2E7D32" />
                <circle cx="330" cy="375" r="3" fill="#2E7D32" />
                <circle cx="315" cy="385" r="3" fill="#1B5E20" />
                <!-- Belly spots -->
                <circle cx="310" cy="395" r="3" fill="#FFF9C4" opacity="0.7" />
                <circle cx="330" cy="400" r="2" fill="#FFF9C4" opacity="0.7" />
            </g>

            <!-- Shadow -->
            <ellipse cx="320" cy="520" rx="50" ry="8" fill="rgba(0,0,0,0.3)" opacity="0.6" />

            <!-- Speed lines -->
            <g stroke="#FFEB3B" stroke-width="2" opacity="0.6">
                <line x1="50" y1="450" x2="100" y2="455" />
                <line x1="60" y1="460" x2="110" y2="465" />
                <line x1="70" y1="455" x2="120" y2="460" />
                <line x1="55" y1="465" x2="105" y2="470" />
                <line x1="65" y1="470" x2="115" y2="475" />
            </g>

            <!-- Flying bugs -->
            <g fill="#FF1744">
                <circle cx="800" cy="200" r="3" />
                <circle cx="850" cy="250" r="2" />
                <circle cx="900" cy="180" r="2.5" />
                <circle cx="750" cy="220" r="2" />
                <circle cx="820" cy="230" r="2.5" />
            </g>

            <!-- Grass tufts -->
            <g fill="#66BB6A">
                <circle cx="150" cy="565" r="4" />
                <circle cx="200" cy="570" r="3" />
                <circle cx="250" cy="565" r="4" />
                <circle cx="400" cy="570" r="3" />
                <circle cx="450" cy="565" r="4" />
                <circle cx="600" cy="570" r="3" />
                <circle cx="650" cy="565" r="4" />
                <circle cx="800" cy="570" r="3" />
                <circle cx="850" cy="565" r="4" />
                <circle cx="1000" cy="570" r="3" />
                <circle cx="1050" cy="565" r="4" />
                <circle cx="1150" cy="570" r="3" />
            </g>

            <!-- Water drop / dew -->
            <g>
                <circle cx="310" cy="345" r="2" fill="#FFFFFF" opacity="0.5" />
                <circle cx="335" cy="340" r="1.5" fill="#FFFFFF" opacity="0.4" />
            </g>
        </svg>
    </div>
</body>
</html>
