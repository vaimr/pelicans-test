    <svg class="bike-group" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">

        <!-- Рама велосипеда -->
        <path d="M150,120 Q180,100 220,130 L210,140 Q180,150 150,120Z" fill="none" stroke="#555" stroke-width="4"/>
        <path d="M150,120 Q120,100 80,130 L90,140 Q120,150 150,120Z" fill="none" stroke="#555" stroke-width="4"/>
        <line x1="80" y1="130" x2="220" y2="130" stroke="#555" stroke-width="4"/>
        <circle cx="150" cy="120" r="6" fill="#333"/>

        <!-- Заднее колесо со спицами -->
        <g class="back-wheel" transform="translate(80, 150)">
            <circle class="wheel" cx="0" cy="0" r="35"/>
            <g class="spokes">
                <line x1="0" y1="0" x2="0" y2="-35"/>
                <line x1="0" y1="0" x2="17" y2="-30"/>
                <line x1="0" y1="0" x2="30" y2="-17"/>
                <line x1="0" y1="0" x2="35" y2="0"/>
                <line x1="0" y1="0" x2="30" y2="17"/>
                <line x1="0" y1="0" x2="17" y2="30"/>
                <line x1="0" y1="0" x2="0" y2="35"/>
                <line x1="0" y1="0" x2="-17" y2="30"/>
                <line x1="0" y1="0" x2="-30" y2="17"/>
                <line x1="0" y1="0" x2="-35" y2="0"/>
                <line x1="0" y1="0" x2="-30" y2="-17"/>
                <line x1="0" y1="0" x2="-17" y2="-30"/>
            </g>
        </g>

        <!-- Переднее колесо со спицами -->
        <g class="front-wheel" transform="translate(220, 150)">
            <circle class="wheel" cx="0" cy="0" r="35"/>
            <g class="spokes">
                <line x1="0" y1="0" x2="0" y2="-35"/>
                <line x1="0" y1="0" x2="17" y2="-30"/>
                <line x1="0" y1="0" x2="30" y2="-17"/>
                <line x1="0" y1="0" x2="35" y2="0"/>
                <line x1="0" y1="0" x2="30" y2="17"/>
                <line x1="0" y1="0" x2="17" y2="30"/>
                <line x1="0" y1="0" x2="0" y2="35"/>
                <line x1="0" y1="0" x2="-17" y2="30"/>
                <line x1="0" y1="0" x2="-30" y2="17"/>
                <line x1="0" y1="0" x2="-35" y2="0"/>
                <line x1="0" y1="0" x2="-30" y2="-17"/>
                <line x1="0" y1="0" x2="-17" y2="-30"/>
            </g>
        </g>

        <!-- Шатун и педали (вращение вокруг центра "каретки") -->
        <g class="crank-group" transform="translate(150, 120)">
            <line class="crank" x1="0" y1="0" x2="0" y2="30"/>

            <!-- Левая педаль -->
            <g transform="rotate(-45)">
                <circle class="pedal-circle" cx="0" cy="30" r="6"/>
                <line x1="0" y1="30" x2="0" y2="45" stroke="#444" stroke-width="4"/>
            </g>

            <!-- Правая педаль -->
            <g transform="rotate(135)">
                <circle class="pedal-circle" cx="0" cy="30" r="6"/>
                <line x1="0" y1="30" x2="0" y2="45" stroke="#444" stroke-width="4"/>
            </g>
        </g>

        <!-- Сиденье -->
        <ellipse cx="150" cy="90" rx="20" ry="8" fill="#8B4513"/>

        <!-- Пеликан сидит на сиденье -->
        <g transform="translate(150, 70) scale(0.8)">

            <!-- Зоб (самый большой элемент) -->
            <ellipse class="zob" cx="-10" cy="20" rx="40" ry="25" />

            <!-- Тело -->
            <ellipse class="pelican-body" cx="0" cy="0" rx="50" ry="35"/>

            <!-- Голова -->
            <ellipse class="pelican-body" cx="-35" cy="-15" rx="25" ry="20"/>

            <!-- Клюв (большой и мультяшный) -->
            <polygon class="pelican-beak" points="-65,-15 -100,-5 -100,15 -65,5" />

            <!-- Глаза -->
            <ellipse class="eye-white" cx="-45" cy="-20" rx="5" ry="7"/>
            <ellipse class="pupil" cx="-47" cy="-20" rx="2" ry="3"/>

            <!-- Крыло (сложено) -->
            <path class="pelican-body" d="M10,10 C20,25 30,25 40,10" stroke="#DAA520" stroke-width="8" fill="none" stroke-linecap="round"/>

            <!-- Ноги крутят педали (анимированы через наклон рамы и вращение педалей выше) -->
            <line class="leg" x1="15" y1="30" x2="30" y2="60"/>
            <line class="leg" x1="-15" y1="30" x2="-30" y2="60"/>

            <!-- Лапки -->
            <polyline points="30,60 35,70 25,70" fill="none" stroke="#DEB887" stroke-width="4"/>
            <polyline points="-30,60 -35,70 -25,70" fill="none" stroke="#DEB887" stroke-width="4"/>
        </g>
    </svg>
